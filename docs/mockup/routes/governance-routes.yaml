openapi: 3.1.0
info:
  title: Governance UX API
  version: 0.1.0
x-solpoc-route-markdown: docs/mockup/routes/governance-routes.md
paths:
  /api/v0/governance/retrieve-conversation-governance:
    get:
      operationId: retrieveConversationGovernance
      summary: Retrieve conversation governance
      description: Retrieves the authorized, UI-ready governance result for one selected conversation governance view.
      tags:
        - governance
      x-solpoc-source-actions:
        - "docs/mockup/desktop/governance/members.md — Retrieve Conversation Roster"
        - "docs/mockup/desktop/governance/settings.md — Retrieve Conversation Governance Settings"
      x-solpoc-mockup-files:
        - docs/mockup/desktop/governance/members.html
        - docs/mockup/desktop/governance/members.md
        - docs/mockup/desktop/governance/settings.html
        - docs/mockup/desktop/governance/settings.md
      security:
        - sessionCookie: []
      parameters:
        - name: conversationUid
          in: query
          required: true
          description: Public identifier from the current conversation page route.
          schema:
            type: string
        - name: view
          in: query
          required: true
          description: Single governance view selected by the open page.
          schema:
            type: string
            enum:
              - MEMBERS
              - SETTINGS
      responses:
        '200':
          description: UI-ready governance result for the requested view.
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                  - conversationUid
                  - view
                  - lifecycleStatus
                  - viewerRole
                properties:
                  result:
                    type: string
                    enum:
                      - SUCCEEDED
                  conversationUid:
                    type: string
                  view:
                    type: string
                    enum:
                      - MEMBERS
                      - SETTINGS
                  lifecycleStatus:
                    type: string
                    enum:
                      - ACTIVE
                      - ARCHIVED
                  viewerRole:
                    type: string
                    enum:
                      - OWNER
                      - ADMINISTRATOR
                      - MEMBER
                  displayTimeZone:
                    type: string
                  activeCount:
                    type: integer
                  formerCount:
                    type: integer
                  ownerContinuity:
                    type: object
                    required:
                      - isCurrentViewerLastActiveOwner
                      - message
                    properties:
                      isCurrentViewerLastActiveOwner:
                        type: boolean
                      message:
                        type: string
                  participants:
                    type: array
                    items:
                      type: object
                      required:
                        - participantUid
                        - displayName
                        - identityType
                        - role
                        - membershipState
                        - accessState
                        - memberSince
                        - postingSuspension
                        - allowedActions
                      properties:
                        participantUid:
                          type: string
                        displayName:
                          type: string
                        identityType:
                          type: string
                          enum:
                            - PERSON
                            - BOT
                        role:
                          type: string
                          enum:
                            - OWNER
                            - ADMINISTRATOR
                            - MEMBER
                        membershipState:
                          type: string
                          enum:
                            - ACTIVE
                            - REMOVED
                            - BANNED
                        accessState:
                          type: string
                          enum:
                            - ACTIVE
                            - POSTING_SUSPENDED
                            - INACTIVE
                        memberSince:
                          type: string
                          format: date-time
                        bannedAt:
                          type: string
                          format: date-time
                        postingSuspension:
                          oneOf:
                            - type: object
                              required:
                                - suspensionUid
                                - endsAt
                                - displayTimeZone
                              properties:
                                suspensionUid:
                                  type: string
                                endsAt:
                                  type: string
                                  format: date-time
                                displayTimeZone:
                                  type: string
                            - type: 'null'
                        allowedActions:
                          type: array
                          items:
                            type: string
                  currentStep:
                    type: string
                    enum:
                      - SETTINGS
                  tags:
                    type: array
                    items:
                      type: string
                  tagCount:
                    type: integer
                  discovery:
                    type: object
                    required:
                      - visibility
                      - displayLabel
                    properties:
                      visibility:
                        type: string
                        enum:
                          - LISTED
                          - UNLISTED
                      displayLabel:
                        type: string
                  matching:
                    type: object
                    required:
                      - mode
                      - displayLabel
                      - displayMeaning
                    properties:
                      mode:
                        type: string
                        enum:
                          - EXCLUSIVE
                          - INCLUSIVE
                          - ALL_TAGS
                      displayLabel:
                        type: string
                      displayMeaning:
                        type: string
                  allowedActions:
                    type: array
                    items:
                      type: string
              examples:
                members:
                  value:
                    result: SUCCEEDED
                    conversationUid: f47ac10b58cc4372a5670e02b2c3d479
                    view: MEMBERS
                    lifecycleStatus: ACTIVE
                    viewerRole: OWNER
                    displayTimeZone: America/New_York
                    activeCount: 3
                    formerCount: 1
                    ownerContinuity:
                      isCurrentViewerLastActiveOwner: true
                      message: Promote another participant to owner or archive the conversation before leaving.
                    participants:
                      - participantUid: 8f14e45fceea467a9b53c3f5e5d5c918
                        displayName: Rowan Ellis
                        identityType: PERSON
                        role: OWNER
                        membershipState: ACTIVE
                        accessState: ACTIVE
                        memberSince: '2026-05-14T13:00:00Z'
                        postingSuspension: null
                        allowedActions: []
                      - participantUid: a3bb189e8bf943f4a3f107c4b6bb12e3
                        displayName: Avery Brooks
                        identityType: PERSON
                        role: MEMBER
                        membershipState: ACTIVE
                        accessState: ACTIVE
                        memberSince: '2026-06-02T15:30:00Z'
                        postingSuspension: null
                        allowedActions:
                          - PROMOTE_TO_OWNER
                          - PROMOTE_TO_ADMINISTRATOR
                          - CREATE_POSTING_SUSPENSION
                          - REMOVE_PARTICIPANT
                          - BAN_IDENTITY
                      - participantUid: c7d934725d23424daf163bf811a3506e
                        displayName: Patchwork Bot
                        identityType: BOT
                        role: MEMBER
                        membershipState: ACTIVE
                        accessState: POSTING_SUSPENDED
                        memberSince: '2026-06-08T12:15:00Z'
                        postingSuspension:
                          suspensionUid: 9d19c22f3a024ee08c9bcf677dab8f2b
                          endsAt: '2026-08-01T14:30:00Z'
                          displayTimeZone: America/New_York
                        allowedActions:
                          - UPDATE_POSTING_SUSPENSION
                          - END_POSTING_SUSPENSION
                          - REMOVE_PARTICIPANT
                          - BAN_IDENTITY
                      - participantUid: 4be219f68d0b4e6486fe7d9cc4e8717b
                        displayName: Release Notes Bot
                        identityType: BOT
                        role: MEMBER
                        membershipState: BANNED
                        accessState: INACTIVE
                        memberSince: '2026-04-09T09:00:00Z'
                        bannedAt: '2026-07-10T17:05:00Z'
                        postingSuspension: null
                        allowedActions:
                          - RESTORE_BANNED_PARTICIPANT
                settings:
                  value:
                    result: SUCCEEDED
                    conversationUid: f47ac10b58cc4372a5670e02b2c3d479
                    view: SETTINGS
                    lifecycleStatus: ACTIVE
                    viewerRole: OWNER
                    currentStep: SETTINGS
                    tags:
                      - design-systems
                      - accessibility
                      - frontend
                      - product-design
                    tagCount: 4
                    discovery:
                      visibility: LISTED
                      displayLabel: Listed
                    matching:
                      mode: EXCLUSIVE
                      displayLabel: Exclusive
                      displayMeaning: People find this conversation only when their search matches the complete tag set.
                    allowedActions:
                      - UPDATE_CONVERSATION_TAGS
                      - ARCHIVE_CONVERSATION
  /api/v0/governance/promote-participant-role:
    post:
      operationId: promoteParticipantRole
      summary: Promote participant role
      description: Promotes an eligible active participant to the selected owner or administrator role and returns the authoritative roster state.
      tags:
        - governance
      x-solpoc-source-actions:
        - "docs/mockup/desktop/governance/members.md — Promote Participant to Owner"
        - "docs/mockup/desktop/governance/members.md — Promote Participant to Administrator"
      x-solpoc-mockup-files:
        - docs/mockup/desktop/governance/members.html
        - docs/mockup/desktop/governance/members.md
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conversationUid
                - participantUid
                - targetRole
              properties:
                conversationUid:
                  type: string
                participantUid:
                  type: string
                targetRole:
                  type: string
                  enum:
                    - OWNER
                    - ADMINISTRATOR
            example:
              conversationUid: f47ac10b58cc4372a5670e02b2c3d479
              participantUid: a3bb189e8bf943f4a3f107c4b6bb12e3
              targetRole: ADMINISTRATOR
      responses:
        '200':
          description: Authoritative participant role and ownership-continuity state.
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                  - participant
                  - ownerContinuity
                properties:
                  result:
                    type: string
                    enum:
                      - SUCCEEDED
                  participant:
                    type: object
                    required:
                      - participantUid
                      - displayName
                      - role
                      - membershipState
                      - accessState
                      - allowedActions
                    properties:
                      participantUid:
                        type: string
                      displayName:
                        type: string
                      role:
                        type: string
                        enum:
                          - OWNER
                          - ADMINISTRATOR
                      membershipState:
                        type: string
                        enum:
                          - ACTIVE
                      accessState:
                        type: string
                        enum:
                          - ACTIVE
                          - POSTING_SUSPENDED
                      allowedActions:
                        type: array
                        items:
                          type: string
                  ownerContinuity:
                    type: object
                    required:
                      - hasAnotherActiveOwner
                    properties:
                      hasAnotherActiveOwner:
                        type: boolean
              example:
                result: SUCCEEDED
                participant:
                  participantUid: a3bb189e8bf943f4a3f107c4b6bb12e3
                  displayName: Avery Brooks
                  role: ADMINISTRATOR
                  membershipState: ACTIVE
                  accessState: ACTIVE
                  allowedActions:
                    - PROMOTE_TO_OWNER
                    - CREATE_POSTING_SUSPENSION
                    - REMOVE_PARTICIPANT
                    - BAN_IDENTITY
                ownerContinuity:
                  hasAnotherActiveOwner: false
  /api/v0/governance/remove-participant:
