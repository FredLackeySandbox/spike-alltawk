                      membershipState:
                        type: string
                        enum:
                          - REMOVED
                      accessState:
                        type: string
                        enum:
                          - INACTIVE
                      endedAt:
                        type: string
                        format: date-time
                      allowedActions:
                        type: array
                        items:
                          type: string
                  activeCount:
                    type: integer
                  formerCount:
                    type: integer
              example:
                result: SUCCEEDED
                participant:
                  participantUid: a3bb189e8bf943f4a3f107c4b6bb12e3
                  displayName: Avery Brooks
                  role: MEMBER
                  membershipState: REMOVED
                  accessState: INACTIVE
                  endedAt: '2026-07-23T16:42:00Z'
                  allowedActions:
                    - BAN_IDENTITY
                activeCount: 2
                formerCount: 2
