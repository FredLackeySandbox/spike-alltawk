                    properties:
                      suspensionUid:
                        type: string
                      endsAt:
                        type: string
                        format: date-time
                      displayTimeZone:
                        type: string
                  allowedActions:
                    type: array
                    items:
                      type: string
              example:
                result: SUCCEEDED
                participantUid: a3bb189e8bf943f4a3f107c4b6bb12e3
                accessState: POSTING_SUSPENDED
                postingSuspension:
                  suspensionUid: 9d19c22f3a024ee08c9bcf677dab8f2b
