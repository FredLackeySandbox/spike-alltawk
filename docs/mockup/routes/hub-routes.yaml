openapi: 3.1.0
info:
  title: Hub UX API
  version: 0.1.0
x-solpoc-route-markdown: docs/mockup/routes/hub-routes.md
paths:
  /api/v0/hub/create-conversation:
    post:
      operationId: createConversation
      summary: Create a conversation
      description: Creates a listed or unlisted conversation and establishes the identified creator as its first owner.
      tags:
        - hub
      x-solpoc-source-actions:
        - docs/mockup/desktop/hub/create.md — Create Conversation
      x-solpoc-mockup-files:
        - docs/mockup/desktop/hub/create.html
        - docs/mockup/desktop/hub/create.md
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tags
                - visibility
                - matchingMode
              properties:
                tags:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items:
                    type: string
                    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)?$'
                visibility:
                  type: string
                  enum:
                    - LISTED
                    - UNLISTED
                matchingMode:
                  type: string
                  enum:
                    - INCLUSIVE
                    - EXCLUSIVE
            example:
              tags:
                - community-design
                - atlanta
              visibility: LISTED
              matchingMode: INCLUSIVE
      responses:
        '201':
          description: Conversation creation result, including validation and recoverable failure states.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - state
                properties:
                  state:
                    type: string
                    enum:
                      - CREATED
                      - VALIDATION_FAILED
                      - TEMPORARILY_UNAVAILABLE
                      - TIMED_OUT
                  conversationUid:
                    $ref: '#/components/schemas/ConversationUid'
                  currentRole:
                    type: string
                    enum:
                      - OWNER
                  workspaceUrl:
                    $ref: '#/components/schemas/WorkspaceUrl'
                  fieldFeedback:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - field
                        - message
                      properties:
                        field:
                          type: string
                        message:
                          type: string
                  canRetry:
                    type: boolean
              example:
                state: CREATED
                conversationUid: f47ac10b58cc4372a5670e02b2c3d479
                currentRole: OWNER
                workspaceUrl: /conversation/f47ac10b58cc4372a5670e02b2c3d479
  /api/v0/hub/retrieve-listed-tag-suggestions:
    get:
      operationId: retrieveListedTagSuggestions
      summary: Retrieve listed tag suggestions
      description: Returns privacy-filtered listed-discovery tag suggestions for the visible partial tag and selected tags.
      tags:
        - hub
      x-solpoc-source-actions:
        - docs/mockup/desktop/hub/find.md — Retrieve Listed Tag Suggestions
      x-solpoc-mockup-files:
        - docs/mockup/desktop/hub/find.html
        - docs/mockup/desktop/hub/find.md
      security:
        - sessionCookie: []
      parameters:
        - name: partialTag
          in: query
          required: true
          description: Current visible listed-search input; it may be an empty string.
          schema:
            type: string
        - name: selectedTag
          in: query
          required: true
          description: Repeated once for every selected visible tag chip.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 10
            uniqueItems: true
            items:
              type: string
              pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)?$'
      responses:
        '200':
          description: Eligible listed tag suggestions, which may be empty.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - partialTag
                  - suggestions
                properties:
                  partialTag:
                    type: string
                  suggestions:
                    type: array
                    items:
                      type: string
              example:
                partialTag: des
                suggestions:
                  - design-systems
  /api/v0/hub/search-listed-conversations:
    get:
      operationId: searchListedConversations
      summary: Search listed conversations
      description: Evaluates the selected visible tags and returns only display-ready listed conversation matches.
      tags:
        - hub
      x-solpoc-source-actions:
        - docs/mockup/desktop/hub/find.md — Search Listed Conversations
      x-solpoc-mockup-files:
        - docs/mockup/desktop/hub/find.html
        - docs/mockup/desktop/hub/find.md
      security:
        - sessionCookie: []
      parameters:
        - name: selectedTag
          in: query
          required: true
          description: Repeated once for every visible validated tag chip; omitted only when the route is not invoked.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 10
            uniqueItems: true
            items:
              type: string
              pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)?$'
      responses:
        '200':
          description: Listed search result, empty result, or recoverable failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - state
                  - selectedTags
                properties:
                  state:
                    type: string
                    enum:
                      - MATCHES
                      - EMPTY
                      - TEMPORARILY_UNAVAILABLE
                  selectedTags:
                    type: array
                    minItems: 1
                    maxItems: 10
                    uniqueItems: true
                    items:
                      type: string
                      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)?$'
                  conversations:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - conversationUid
                        - tags
                        - participantCount
                        - activityLabel
                        - matchingMode
                      properties:
                        conversationUid:
                          $ref: '#/components/schemas/ConversationUid'
                        tags:
                          type: array
                          minItems: 1
                          maxItems: 10
                          uniqueItems: true
                          items:
                            type: string
                            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)?$'
                        participantCount:
                          type: integer
                          minimum: 0
                        activityLabel:
                          type: string
                        matchingMode:
                          type: string
                          enum:
                            - INCLUSIVE
                            - EXCLUSIVE
                  canRetry:
                    type: boolean
              example:
                state: MATCHES
                selectedTags:
                  - product-design
                conversations:
                  - conversationUid: f47ac10b58cc4372a5670e02b2c3d479
                    tags:
                      - product-design
                      - accessibility
                      - research
                    participantCount: 18
                    activityLabel: Active 12 minutes ago
                    matchingMode: INCLUSIVE
  /api/v0/hub/join-listed-conversation:
    post:
      operationId: joinListedConversation
      summary: Join a listed conversation
      description: Rechecks eligibility for a selected listed conversation and establishes or resumes active membership.
      tags:
        - hub
      x-solpoc-source-actions:
        - docs/mockup/desktop/hub/find.md — Join Listed Conversation
      x-solpoc-mockup-files:
        - docs/mockup/desktop/hub/find.html
        - docs/mockup/desktop/hub/find.md
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - conversationUid
              properties:
                conversationUid:
                  $ref: '#/components/schemas/ConversationUid'
            example:
              conversationUid: f47ac10b58cc4372a5670e02b2c3d479
      responses:
        '200':
          description: Listed membership result or recoverable failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - state
                  - conversationUid
                properties:
                  state:
                    type: string
                    enum:
                      - JOINED
                      - NOT_ELIGIBLE
                      - TEMPORARILY_UNAVAILABLE
                  conversationUid:
                    $ref: '#/components/schemas/ConversationUid'
                  workspaceUrl:
                    $ref: '#/components/schemas/WorkspaceUrl'
                  canRetry:
                    type: boolean
              example:
                state: JOINED
                conversationUid: f47ac10b58cc4372a5670e02b2c3d479
                workspaceUrl: /conversation/f47ac10b58cc4372a5670e02b2c3d479
  /api/v0/hub/evaluate-known-unlisted-conversation-tags:
    post:
      operationId: evaluateKnownUnlistedConversationTags
      summary: Evaluate known unlisted conversation tags
      description: Privately evaluates visible tags and returns only privacy-safe match state and continuation data.
      tags:
        - hub
      x-solpoc-source-actions:
        - docs/mockup/desktop/hub/find.md — Evaluate Known Unlisted Conversation Tags
      x-solpoc-mockup-files:
        - docs/mockup/desktop/hub/find.html
        - docs/mockup/desktop/hub/find.md
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tags
              properties:
                tags:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items:
                    type: string
                    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)?$'
            example:
              tags:
                - release-triage
                - incident-ops
      responses:
        '200':
          description: Privacy-safe unlisted evaluation result or recoverable failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - state
                properties:
                  state:
                    type: string
                  hiddenMatchCount:
                    type: integer
                    minimum: 0
                  canJoin:
                    type: boolean
                  unlistedJoinChallengeUid:
                    $ref: '#/components/schemas/UnlistedJoinChallengeUid'
                  canRetry:
                    type: boolean
              example:
                state: COMPLETE_ELIGIBLE
                hiddenMatchCount: 1
                canJoin: true
                unlistedJoinChallengeUid: a3bb189e8bf9479690a48e72b8fc5d23
  /api/v0/hub/join-unlisted-conversation:
    post:
      operationId: joinUnlistedConversation
      summary: Join an unlisted conversation
      description: Revalidates an opaque unlisted join challenge and establishes active membership without exposing hidden conversation details.
      tags:
        - hub
      x-solpoc-source-actions:
        - docs/mockup/desktop/hub/find.md — Join Unlisted Conversation
      x-solpoc-mockup-files:
        - docs/mockup/desktop/hub/find.html
        - docs/mockup/desktop/hub/find.md
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - unlistedJoinChallengeUid
              properties:
                unlistedJoinChallengeUid:
                  $ref: '#/components/schemas/UnlistedJoinChallengeUid'
            example:
              unlistedJoinChallengeUid: a3bb189e8bf9479690a48e72b8fc5d23
      responses:
        '200':
          description: Unlisted membership result, challenge-expiry result, or recoverable failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - state
                properties:
                  state:
                    type: string
                    enum:
                      - JOINED
                      - NOT_ELIGIBLE
                      - CHALLENGE_EXPIRED
                      - TEMPORARILY_UNAVAILABLE
                  conversationUid:
                    $ref: '#/components/schemas/ConversationUid'
                  workspaceUrl:
                    $ref: '#/components/schemas/WorkspaceUrl'
                  reevaluationRequired:
                    type: boolean
                  canRetry:
                    type: boolean
              example:
                state: JOINED
                conversationUid: 6ba7b8109dad41d180b400c04fd430c8
                workspaceUrl: /conversation/6ba7b8109dad41d180b400c04fd430c8
  /api/v0/hub/retrieve-joined-conversations:
    get:
      operationId: retrieveJoinedConversations
      summary: Retrieve joined conversations
      description: Loads the identified person's display-ready active joined-conversation projection, ordered newest first.
      tags:
        - hub
      x-solpoc-source-actions:
        - docs/mockup/desktop/hub/index.md — Retrieve Joined Conversations
      x-solpoc-mockup-files:
        - docs/mockup/desktop/hub/index.html
        - docs/mockup/desktop/hub/index.md
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Joined-conversation list, empty state, recoverable failure, or session-required state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - state
                properties:
                  state:
                    type: string
                    enum:
                      - POPULATED
                      - EMPTY
                      - TEMPORARILY_UNAVAILABLE
                      - SESSION_REQUIRED
                  conversationCount:
                    type: integer
                    minimum: 0
                  conversations:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - conversationUid
                        - kind
                        - tags
                        - role
                        - recentActivity
                      properties:
                        conversationUid:
                          $ref: '#/components/schemas/ConversationUid'
                        kind:
                          type: string
                          enum:
                            - STANDARD
                            - MODERATION
                        tags:
                          type: array
                          minItems: 1
                          maxItems: 10
                          uniqueItems: true
                          items:
                            type: string
                            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)?$'
                        role:
                          type: string
                          enum:
                            - OWNER
                            - ADMINISTRATOR
                            - MEMBER
                        recentActivity:
                          type: object
                          additionalProperties: false
                          required:
                            - authorDisplayName
                            - excerpt
                            - relativeTime
                          properties:
                            authorDisplayName:
                              type: string
                            excerpt:
                              type: string
                            relativeTime:
                              type: string
                  canRetry:
                    type: boolean
                  recoveryUrl:
                    type: string
                    pattern: '^/$'
              example:
                state: POPULATED
                conversationCount: 2
                conversations:
                  - conversationUid: f47ac10b58cc4372a5670e02b2c3d479
                    kind: STANDARD
                    tags:
                      - product-design
                      - accessibility
                      - research
                    role: OWNER
                    recentActivity:
                      authorDisplayName: Maya Chen
                      excerpt: The keyboard walkthrough is ready for a second pass.
                      relativeTime: 12 min ago
                  - conversationUid: 6ba7b8109dad41d180b400c04fd430c8
                    kind: MODERATION
                    tags:
                      - mod-review
                      - ticket-1048
                    role: ADMINISTRATOR
                    recentActivity:
                      authorDisplayName: Priya Nair
                      excerpt: I added the relevant context for tomorrow’s review.
                      relativeTime: Yesterday
  /api/v0/hub/resolve-joined-conversation-access:
    get:
      operationId: resolveJoinedConversationAccess
      summary: Resolve joined conversation access
      description: Rechecks authoritative access for a selected joined conversation before returning a workspace continuation.
      tags:
        - hub
      x-solpoc-source-actions:
        - docs/mockup/desktop/hub/index.md — Resolve Joined Conversation Access
      x-solpoc-mockup-files:
        - docs/mockup/desktop/hub/index.html
        - docs/mockup/desktop/hub/index.md
      security:
        - sessionCookie: []
      parameters:
        - name: conversationUid
          in: query
          required: true
          description: Public conversation identifier from the selected visible Resume control.
          schema:
            $ref: '#/components/schemas/ConversationUid'
      responses:
        '200':
          description: Active access, stale membership, or recoverable resolution failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - accessState
                  - conversationUid
                properties:
                  accessState:
                    type: string
                    enum:
                      - ACTIVE
                      - NO_LONGER_AVAILABLE
                      - TEMPORARILY_UNAVAILABLE
                  conversationUid:
                    $ref: '#/components/schemas/ConversationUid'
                  workspaceUrl:
                    $ref: '#/components/schemas/WorkspaceUrl'
                  removeFromJoined:
                    type: boolean
                  canRetry:
                    type: boolean
              example:
                accessState: ACTIVE
                conversationUid: f47ac10b58cc4372a5670e02b2c3d479
                workspaceUrl: /conversation/f47ac10b58cc4372a5670e02b2c3d479
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tawk_session
      description: HttpOnly opaque session cookie sent automatically by the browser.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Opaque CSRF reference supplied by private page bootstrap and retained in browser memory.
      schema:
        type: string
  schemas:
    ConversationUid:
      type: string
      pattern: '^[a-f0-9]{32}$'
      description: Public conversation identifier.
    UnlistedJoinChallengeUid:
      type: string
      pattern: '^[a-f0-9]{32}$'
      description: Public-safe, session-bound continuation for the latest eligible unlisted evaluation.
    WorkspaceUrl:
      type: string
      pattern: '^/conversation/[a-f0-9]{32}$'
      description: Browser-safe continuation to an accessible conversation workspace.
