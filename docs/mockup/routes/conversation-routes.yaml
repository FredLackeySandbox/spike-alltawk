      x-solpoc-source-actions:
        - docs/mockup/desktop/conversation/thread.md — Update Conversation Note
      x-solpoc-mockup-files:
        - docs/mockup/desktop/conversation/thread.html
        - docs/mockup/desktop/conversation/thread.md
  /api/v0/conversation/submit-message-report:
    post:
      operationId: submitMessageReport
      summary: Submit a message report
      description: Creates a numbered moderation ticket for a selected message after deriving reporting identity and moderator access server-side.
      tags:
        - conversation
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - messageUid
                - explanation
              properties:
                messageUid:
                  type: string
                explanation:
                  type: string
            example:
              messageUid: 7c9e6679742f40de944be07fc1f90ae7
              explanation: Please review whether this message exposes unsafe access details.
      responses:
        '201':
          description: Moderation ticket created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - outcome
                  - messageUid
                  - ticketNumber
                  - messageIndicator
                  - confirmationMessage
                properties:
                  outcome:
                    type: string
                    enum:
                      - SUBMITTED
                  messageUid:
                    type: string
                  ticketNumber:
                    type: string
                  messageIndicator:
                    type: string
                  confirmationMessage:
                    type: string
              example:
                outcome: SUBMITTED
                messageUid: 7c9e6679742f40de944be07fc1f90ae7
                ticketNumber: '1048'
                messageIndicator: 'Reported #1048'
                confirmationMessage: 'Report #1048 was sent to the conversation moderators.'
      x-solpoc-source-actions:
