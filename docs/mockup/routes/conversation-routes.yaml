openapi: 3.1.0
info:
  title: Conversation UX API
  version: 0.1.0
x-solpoc-route-markdown: docs/mockup/routes/conversation-routes.md
paths:
  /api/v0/conversation/retrieve-workspace:
    get:
      operationId: retrieveConversationWorkspace
      summary: Retrieve the active conversation workspace
      description: Retrieves display-ready conversation, participant, message, reaction, permission, restriction, and owner-continuity state for the public conversation UID.
      tags:
        - conversation
      security:
        - sessionCookie: []
      parameters:
        - name: conversationUid
          in: query
          required: true
          description: Safe public UID carried by the incoming conversation page route.
          schema:
            type: string
          example: f47ac10b58cc4372a5670e02b2c3d479
      responses:
        '200':
          description: Display-ready conversation workspace state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - workspaceState
                  - conversation
                  - currentParticipant
                  - postingRestriction
                  - participants
                  - messages
                properties:
                  workspaceState:
                    type: string
                    enum:
                      - READY
                  conversation:
                    type: object
                    additionalProperties: false
                    required:
                      - conversationUid
                      - access
                      - matchingMode
                      - tags
                      - activeParticipantCount
                    properties:
                      conversationUid:
                        type: string
                      access:
                        type: string
                        enum:
                          - LISTED
                      matchingMode:
                        type: string
                        enum:
                          - INCLUSIVE
                      tags:
                        type: array
                        items:
                          type: string
                      activeParticipantCount:
                        type: integer
                  currentParticipant:
                    type: object
                    additionalProperties: false
                    required:
                      - displayName
                      - role
                      - canPost
                      - canLeave
                      - canManageTagsAndLifecycle
                      - canManageMembers
                      - canReviewReports
                      - leaveBlockReason
                    properties:
                      displayName:
                        type: string
                      role:
                        type: string
                        enum:
                          - OWNER
                          - ADMINISTRATOR
                          - MEMBER
                      canPost:
                        type: boolean
                      canLeave:
                        type: boolean
                      canManageTagsAndLifecycle:
                        type: boolean
                      canManageMembers:
                        type: boolean
                      canReviewReports:
                        type: boolean
                      leaveBlockReason:
                        type:
                          - string
                          - 'null'
                  postingRestriction:
                    type:
                      - object
                      - 'null'
                    additionalProperties: false
                    required:
                      - kind
                      - message
                      - endsAtDisplay
                    properties:
                      kind:
                        type: string
                        enum:
                          - SUSPENDED
                      message:
                        type: string
                      endsAtDisplay:
                        type: string
                  participants:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - displayName
                        - participantType
                        - roleLabel
                        - presence
                        - isCurrentParticipant
                      properties:
                        displayName:
                          type: string
                        participantType:
                          type: string
                          enum:
                            - PERSON
                            - BOT
                        roleLabel:
                          type: string
                        presence:
                          type: string
                          enum:
                            - ACTIVE
                        isCurrentParticipant:
                          type: boolean
                  messages:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - messageUid
                        - author
                        - text
                        - postedAt
                        - reactions
                        - noteIndicator
                        - reportIndicator
                        - allowedActions
                      properties:
                        messageUid:
                          type: string
                        author:
                          type: object
                          additionalProperties: false
                          required:
                            - displayName
                            - participantType
                            - roleLabel
                            - isFormerParticipant
                            - isCurrentParticipant
                          properties:
                            displayName:
                              type: string
                            participantType:
                              type: string
                              enum:
                                - PERSON
                                - BOT
                            roleLabel:
                              type: string
                            isFormerParticipant:
                              type: boolean
                            isCurrentParticipant:
                              type: boolean
                        text:
                          type: string
                        postedAt:
                          type: string
                        reactions:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required:
                              - emoji
                              - count
                              - currentParticipantReacted
                            properties:
                              emoji:
                                type: string
                              count:
                                type: integer
                              currentParticipantReacted:
                                type: boolean
                        noteIndicator:
                          type:
                            - string
                            - 'null'
                        reportIndicator:
                          type:
                            - string
                            - 'null'
                        allowedActions:
                          type: object
                          additionalProperties: false
                          required:
                            - canReact
                            - canAddNote
                            - canReport
                            - canDelete
                          properties:
                            canReact:
                              type: boolean
                            canAddNote:
                              type: boolean
                            canReport:
                              type: boolean
                            canDelete:
                              type: boolean
              example:
                workspaceState: READY
                conversation:
                  conversationUid: f47ac10b58cc4372a5670e02b2c3d479
                  access: LISTED
                  matchingMode: INCLUSIVE
                  tags:
                    - urban-gardening
                    - atlanta
                    - pollinators
                  activeParticipantCount: 5
                currentParticipant:
                  displayName: Maya Chen
                  role: OWNER
                  canPost: false
                  canLeave: false
                  canManageTagsAndLifecycle: true
                  canManageMembers: true
                  canReviewReports: true
                  leaveBlockReason: Transfer ownership or archive this conversation before leaving.
                postingRestriction:
                  kind: SUSPENDED
                  message: Posting is paused until Fri, Jul 24, 2026, 9:00 AM ET. Your membership stays active in the meantime.
                  endsAtDisplay: Fri, Jul 24, 2026, 9:00 AM ET
                participants:
                  - displayName: Maya Chen
                    participantType: PERSON
                    roleLabel: Owner
                    presence: ACTIVE
                    isCurrentParticipant: true
                  - displayName: Nadia Rivera
                    participantType: PERSON
                    roleLabel: Administrator
                    presence: ACTIVE
                    isCurrentParticipant: false
                  - displayName: Theo Walker
                    participantType: PERSON
                    roleLabel: Member
                    presence: ACTIVE
                    isCurrentParticipant: false
                  - displayName: SoilWatch
                    participantType: BOT
                    roleLabel: Member
                    presence: ACTIVE
                    isCurrentParticipant: false
                messages:
                  - messageUid: 7c9e6679742f40de944be07fc1f90ae7
                    author:
                      displayName: Maya Chen
                      participantType: PERSON
                      roleLabel: Owner
                      isFormerParticipant: false
                      isCurrentParticipant: true
                    text: I can bring two flats of mountain mint on Saturday.
                    postedAt: '2026-07-22T09:18:00-04:00'
                    reactions:
                      - emoji: 🙋
                        count: 2
                        currentParticipantReacted: true
                    noteIndicator: null
                    reportIndicator: null
                    allowedActions:
                      canReact: true
                      canAddNote: true
                      canReport: true
                      canDelete: false
      x-solpoc-source-actions:
        - docs/mockup/desktop/conversation/thread.md — Retrieve Conversation Workspace
      x-solpoc-mockup-files:
        - docs/mockup/desktop/conversation/thread.html
        - docs/mockup/desktop/conversation/thread.md
  /api/v0/conversation/post-message:
    post:
      operationId: postMessage
      summary: Post a message to the conversation
      description: Creates a durable message after rechecking active membership and posting permission, with author identity derived server-side.
      tags:
        - conversation
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - conversationUid
                - text
              properties:
                conversationUid:
                  type: string
                text:
                  type: string
            example:
              conversationUid: f47ac10b58cc4372a5670e02b2c3d479
              text: I can bring seed trays on Saturday morning.
      responses:
        '201':
          description: Message created and ready for immediate display.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - outcome
                  - message
                  - confirmationMessage
                properties:
                  outcome:
                    type: string
                    enum:
                      - POSTED
                  message:
                    type: object
                    additionalProperties: false
                    required:
                      - messageUid
                      - author
                      - text
                      - postedAt
                      - reactions
                      - allowedActions
                    properties:
                      messageUid:
                        type: string
                      author:
                        type: object
                        additionalProperties: false
                        required:
                          - displayName
                          - participantType
                          - roleLabel
                          - isFormerParticipant
                        properties:
                          displayName:
                            type: string
                          participantType:
                            type: string
                            enum:
                              - PERSON
                          roleLabel:
                            type: string
                          isFormerParticipant:
                            type: boolean
                      text:
                        type: string
                      postedAt:
                        type: string
                      reactions:
                        type: array
                        items:
                          type: object
                      allowedActions:
                        type: object
                        additionalProperties: false
                        required:
                          - canReact
                          - canAddNote
                          - canReport
                          - canDelete
                        properties:
                          canReact:
                            type: boolean
                          canAddNote:
                            type: boolean
                          canReport:
                            type: boolean
                          canDelete:
                            type: boolean
                  confirmationMessage:
                    type: string
              example:
                outcome: POSTED
                message:
                  messageUid: 1b4e28ba2fa14f5ba3c75e06fb7f7e9d
                  author:
                    displayName: Maya Chen
                    participantType: PERSON
                    roleLabel: Owner
                    isFormerParticipant: false
                  text: I can bring seed trays on Saturday morning.
                  postedAt: '2026-07-23T10:14:00-04:00'
                  reactions: []
                  allowedActions:
                    canReact: true
                    canAddNote: true
                    canReport: true
                    canDelete: true
                confirmationMessage: Message posted.
      x-solpoc-source-actions:
        - docs/mockup/desktop/conversation/thread.md — Post Message
      x-solpoc-mockup-files:
        - docs/mockup/desktop/conversation/thread.html
        - docs/mockup/desktop/conversation/thread.md
  /api/v0/conversation/add-emoji-reaction:
    post:
      operationId: addEmojiReaction
      summary: Add an emoji reaction
      description: Adds the current participant's selected emoji reaction to a visible message and returns the display-ready aggregate.
      tags:
        - conversation
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - messageUid
                - emoji
              properties:
                messageUid:
                  type: string
                emoji:
                  type: string
            example:
              messageUid: 7c9e6679742f40de944be07fc1f90ae7
              emoji: 💚
      responses:
        '200':
          description: Updated display-ready reaction aggregate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionChangeResponse'
              example:
                outcome: ADDED
                messageUid: 7c9e6679742f40de944be07fc1f90ae7
                reaction:
                  emoji: 💚
                  count: 2
                  currentParticipantReacted: true
                confirmationMessage: Reaction added.
      x-solpoc-source-actions:
        - docs/mockup/desktop/conversation/thread.md — Add Emoji Reaction
      x-solpoc-mockup-files:
        - docs/mockup/desktop/conversation/thread.html
        - docs/mockup/desktop/conversation/thread.md
  /api/v0/conversation/remove-emoji-reaction:
    delete:
      operationId: removeEmojiReaction
      summary: Remove an emoji reaction
      description: Removes only the current participant's selected emoji reaction and returns the remaining display-ready aggregate.
      tags:
        - conversation
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - messageUid
                - emoji
              properties:
                messageUid:
                  type: string
                emoji:
                  type: string
            example:
              messageUid: 7c9e6679742f40de944be07fc1f90ae7
              emoji: 🙋
      responses:
        '200':
          description: Remaining display-ready reaction aggregate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionChangeResponse'
              example:
                outcome: REMOVED
                messageUid: 7c9e6679742f40de944be07fc1f90ae7
                reaction:
                  emoji: 🙋
                  count: 1
                  currentParticipantReacted: false
                confirmationMessage: Reaction removed.
      x-solpoc-source-actions:
        - docs/mockup/desktop/conversation/thread.md — Remove Emoji Reaction
      x-solpoc-mockup-files:
        - docs/mockup/desktop/conversation/thread.html
        - docs/mockup/desktop/conversation/thread.md
  /api/v0/conversation/retrieve-message-note:
    get:
      operationId: retrieveMessageNote
      summary: Retrieve the message-note form state
      description: Initializes the selected message's note form with either an existing editable note or a blank create state.
      tags:
        - conversation
      security:
        - sessionCookie: []
      parameters:
        - name: messageUid
          in: query
          required: true
          description: Public UID of the selected visible message.
          schema:
            type: string
          example: 7c9e6679742f40de944be07fc1f90ae7
      responses:
        '200':
          description: Participant-accessible message-note form state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - formMode
                  - messageUid
                  - targetAvailable
                  - note
                  - allowedActions
                properties:
                  formMode:
                    type: string
                    enum:
                      - UPDATE
                      - CREATE
                  messageUid:
                    type: string
                  targetAvailable:
                    type: boolean
                  note:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required:
                          - noteUid
                          - text
                        properties:
                          noteUid:
                            type: string
                          text:
                            type: string
                      - type: 'null'
                  allowedActions:
                    type: object
                    additionalProperties: false
                    required:
                      - canCreate
                      - canUpdate
                    properties:
                      canCreate:
                        type: boolean
                      canUpdate:
                        type: boolean
              examples:
                update:
                  summary: Existing-note UPDATE state
                  value:
                    formMode: UPDATE
                    messageUid: 7c9e6679742f40de944be07fc1f90ae7
                    targetAvailable: true
                    note:
                      noteUid: 9f1c2e345a6b4c7d8e9f0123456789ab
                      text: Confirm the sunny strip near the tool shed.
                    allowedActions:
                      canCreate: false
                      canUpdate: true
                create:
                  summary: Blank-note CREATE state
                  value:
                    formMode: CREATE
                    messageUid: 7c9e6679742f40de944be07fc1f90ae7
                    targetAvailable: true
                    note: null
                    allowedActions:
                      canCreate: true
                      canUpdate: false
      x-solpoc-source-actions:
        - docs/mockup/desktop/conversation/thread.md — Retrieve Message Note
      x-solpoc-mockup-files:
        - docs/mockup/desktop/conversation/thread.html
        - docs/mockup/desktop/conversation/thread.md
  /api/v0/conversation/create-message-note:
    post:
      operationId: createMessageNote
      summary: Create a message note
      description: Creates a participant-authored note on a selected message when no editable note exists.
      tags:
        - conversation
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - messageUid
                - text
              properties:
                messageUid:
                  type: string
                text:
                  type: string
            example:
              messageUid: 7c9e6679742f40de944be07fc1f90ae7
              text: Confirm the sunny strip near the tool shed.
      responses:
        '201':
          description: Message note created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - outcome
                  - noteUid
                  - messageIndicator
                  - confirmationMessage
                properties:
                  outcome:
                    type: string
                    enum:
                      - CREATED
                  noteUid:
                    type: string
                  messageIndicator:
                    type: string
                  confirmationMessage:
                    type: string
              example:
                outcome: CREATED
                noteUid: 9f1c2e345a6b4c7d8e9f0123456789ab
                messageIndicator: Note added
                confirmationMessage: Note saved to the message.
      x-solpoc-source-actions:
        - docs/mockup/desktop/conversation/thread.md — Create Message Note
      x-solpoc-mockup-files:
        - docs/mockup/desktop/conversation/thread.html
        - docs/mockup/desktop/conversation/thread.md
  /api/v0/conversation/update-message-note:
    patch:
      operationId: updateMessageNote
      summary: Update a message note
      description: Replaces the editable text of an existing participant-accessible message note while preserving its message attachment.
      tags:
        - conversation
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - noteUid
                - text
              properties:
                noteUid:
                  type: string
                text:
                  type: string
            example:
              noteUid: 9f1c2e345a6b4c7d8e9f0123456789ab
              text: Reserve the sunny strip and two hand trowels.
      responses:
        '200':
          description: Message note updated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - outcome
                  - noteUid
                  - messageIndicator
                  - confirmationMessage
                properties:
                  outcome:
                    type: string
                    enum:
                      - UPDATED
                  noteUid:
                    type: string
                  messageIndicator:
                    type: string
                  confirmationMessage:
                    type: string
              example:
                outcome: UPDATED
                noteUid: 9f1c2e345a6b4c7d8e9f0123456789ab
                messageIndicator: Note added
                confirmationMessage: Note saved to the message.
      x-solpoc-source-actions:
        - docs/mockup/desktop/conversation/thread.md — Update Message Note
      x-solpoc-mockup-files:
        - docs/mockup/desktop/conversation/thread.html
        - docs/mockup/desktop/conversation/thread.md
