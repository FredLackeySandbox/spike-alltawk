<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reports · Tawk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .report__number { font-family: var(--mono); font-size: 13px; color: var(--muted); min-width: 56px; }
  .report__quote { font-size: 14px; color: var(--ink-2); margin-bottom: 5px; }
  .report__meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .report__conv { font-weight: 600; color: var(--ink-2); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="../index.html"><span class="brand__mark">T</span> Tawk</a>
    <nav class="topnav">
      <a href="../hub/conversations.html">Conversations</a>
      <a href="../hub/find-conversations.html">Find</a>
      <a href="../bots/bots.html">Bots</a>
    </nav>
    <div class="spacer"></div>
    <span class="whoami"><span class="avatar avatar--sm" id="meInitials"></span><span id="meName"></span></span>
  </div>
</div>

<main class="app">

  <div class="page-head">
    <h1 class="page-title">Reports</h1>
    <p class="page-sub">Messages that someone flagged in a conversation you own or administer. Nothing from anywhere else appears here.</p>
  </div>

  <div class="section" id="awaitingSection"></div>
  <div class="section" id="actedSection"></div>

</main>

<script src="reports-api.js"></script>
<script>
(async function () {
  'use strict';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  var me = await ReportsApi.getSignedInIdentity();
  document.getElementById('meInitials').textContent = me.initials;
  document.getElementById('meName').textContent = me.displayName;

  var awaiting = await ReportsApi.getReportsAwaitingDecision();
  var acted = await ReportsApi.getReportsAlreadyActedOn();

  var awaitingSection = document.getElementById('awaitingSection');
  var awaitingPanel = el('div', 'panel');
  var awaitingHead = el('div', 'panel__head');
  awaitingHead.appendChild(el('h2', 'panel__title', awaiting.length === 1
    ? '1 report waiting for a decision'
    : awaiting.length + ' reports waiting for a decision'));
  awaitingPanel.appendChild(awaitingHead);

  if (!awaiting.length) {
    var empty = el('div', 'empty');
    empty.appendChild(el('div', 'empty__title', 'Nothing is waiting'));
    empty.appendChild(el('div', '', 'Every report in your conversations has been dealt with.'));
    awaitingPanel.appendChild(empty);
  } else {
    var list = el('div', 'list');
    awaiting.forEach(function (report) { list.appendChild(reportRow(report, false)); });
    awaitingPanel.appendChild(list);
  }
  awaitingSection.appendChild(awaitingPanel);

  var actedSection = document.getElementById('actedSection');
  if (acted.length) {
    var actedPanel = el('div', 'panel');
    var actedHead = el('div', 'panel__head');
    actedHead.appendChild(el('h2', 'panel__title', 'Already acted on'));
    actedPanel.appendChild(actedHead);
    var actedList = el('div', 'list');
    acted.forEach(function (report) { actedList.appendChild(reportRow(report, true)); });
    actedPanel.appendChild(actedList);
    actedSection.appendChild(actedPanel);
  }

  function reportRow(report, resolved) {
    var row = el('a', 'list__item');
    row.href = 'report.html?ticket=' + encodeURIComponent(report.ticketNumber);

    row.appendChild(el('span', 'report__number', '#' + report.ticketNumber));

    var main = el('div', 'list__main');
    main.appendChild(el('div', 'report__quote', '“' + report.reportedExcerpt + '”'));

    var meta = el('div', 'report__meta');
    meta.appendChild(el('span', 'report__conv', report.conversationName));
    meta.appendChild(el('span', '', '·'));
    var tags = el('span', 'tags');
    report.conversationTags.forEach(function (value) {
      tags.appendChild(el('span', 'tag tag--plain', value));
    });
    meta.appendChild(tags);
    meta.appendChild(el('span', '', '·'));
    meta.appendChild(el('span', '', report.reportedAuthorName + ', reported by ' + report.reporterName));
    main.appendChild(meta);
    row.appendChild(main);

    if (resolved) {
      row.appendChild(el('span', 'badge badge--muted', report.outcome));
      row.appendChild(el('span', 'list__meta', report.actedOn));
    } else {
      if (report.hasDiscussion) {
        row.appendChild(el('span', 'badge badge--warning', 'Discussion open'));
      }
      row.appendChild(el('span', 'list__meta', 'waiting ' + report.waitedFor));
    }
    return row;
  }
})();
</script>

</body>
</html>
