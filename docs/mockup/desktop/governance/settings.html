<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation Settings · Tawk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .settings-col { max-width: 680px; }
  .tag-count { font-size: 12.5px; color: var(--muted); }
  .fact { display: flex; gap: 10px; font-size: 13.5px; color: var(--ink-2); margin-bottom: 7px; }
  .fact__key { color: var(--muted); min-width: 96px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="../index.html"><span class="brand__mark">T</span> Tawk</a>
    <nav class="topnav">
      <a href="../hub/conversations.html">Conversations</a>
      <a href="../hub/find-conversations.html">Find</a>
      <a href="../bots/bots.html">Bots</a>
    </nav>
    <div class="spacer"></div>
    <span class="whoami"><span class="avatar avatar--sm" id="meInitials"></span><span id="meName"></span></span>
  </div>
</div>

<main class="app">
  <div id="page"></div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<div class="toast-host" id="toastHost"></div>

<script src="settings-api.js"></script>
<script>
(async function () {
  'use strict';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  function toast(message, variant) {
    var host = document.getElementById('toastHost');
    var node = el('div', 'toast' + (variant ? ' toast--' + variant : ''), message);
    host.appendChild(node);
    setTimeout(function () { node.remove(); }, 3600);
  }

  var backdrop = document.getElementById('modalBackdrop');
  var modal = document.getElementById('modal');

  function closeModal() {
    backdrop.classList.remove('is-open');
    modal.innerHTML = '';
  }

  backdrop.addEventListener('click', function (event) {
    if (event.target === backdrop) { closeModal(); }
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') { closeModal(); }
  });

  function openModal(options) {
    modal.innerHTML = '';
    var head = el('div', 'modal__head');
    head.appendChild(el('h2', 'modal__title', options.title));
    if (options.subtitle) { head.appendChild(el('p', 'modal__sub', options.subtitle)); }
    modal.appendChild(head);
    var body = el('div', 'modal__body');
    body.appendChild(options.body);
    modal.appendChild(body);
    var foot = el('div', 'modal__foot');
    (options.actions || []).forEach(function (action) {
      var button = el('button', 'btn ' + (action.className || ''), action.label);
      button.type = 'button';
      button.addEventListener('click', function () { action.onClick(button); });
      foot.appendChild(button);
    });
    modal.appendChild(foot);
    backdrop.classList.add('is-open');
  }

  /* ---------------------------------------------------------------- */

  var params = new URLSearchParams(window.location.search);
  var conversationId = params.get('id') || 'c-kiln';

  var me = await SettingsApi.getSignedInIdentity();
  document.getElementById('meInitials').textContent = me.initials;
  document.getElementById('meName').textContent = me.displayName;

  var page = document.getElementById('page');
  var conversation = await SettingsApi.getConversation(conversationId);

  if (!conversation) {
    var missing = el('div', 'panel');
    var missingBody = el('div', 'empty');
    missingBody.appendChild(el('div', 'empty__title', 'That conversation is not available to you'));
    missing.appendChild(missingBody);
    page.appendChild(missing);
    return;
  }

  var policy = await SettingsApi.getTagPolicy();
  var namePolicy = await SettingsApi.getNamePolicy();
  var topicPolicy = await SettingsApi.getTopicPolicy();
  var matchingOptions = await SettingsApi.getMatchingOptions();
  var isOwner = conversation.myRole === 'owner';

  /* ---- header ---- */

  var head = el('div', 'page-head');
  var crumb = el('div', 'crumb');
  var backLink = el('a', '', 'Conversation');
  backLink.href = '../workspace/conversation.html?id=' + encodeURIComponent(conversation.id);
  crumb.appendChild(backLink);
  crumb.appendChild(document.createTextNode(' / Settings'));
  head.appendChild(crumb);

  var headRow = el('div', 'row row--between row--top');
  var headLeft = el('div', '');
  headLeft.appendChild(el('h1', 'page-title', 'Conversation settings'));
  headLeft.appendChild(el('p', 'page-sub', 'The name says what this conversation is. The tags decide who can reach it. Changing one does not change the other.'));
  headRow.appendChild(headLeft);
  var membersLink = el('a', 'btn btn--sm', 'Members and roles');
  membersLink.href = 'members.html?id=' + encodeURIComponent(conversation.id);
  headRow.appendChild(membersLink);
  head.appendChild(headRow);
  page.appendChild(head);

  /* ---- name and topic ---- */

  var identityPanel = el('div', 'panel settings-col section');
  var identityHead = el('div', 'panel__head');
  identityHead.appendChild(el('h2', 'panel__title', 'Name and topic'));
  identityPanel.appendChild(identityHead);

  var identityBody = el('div', 'panel__body');

  var nameField = el('div', 'field');
  var nameLabel = el('label', 'label', 'Name');
  nameLabel.htmlFor = 'nameInput';
  nameField.appendChild(nameLabel);
  var nameInput = el('input', 'input');
  nameInput.type = 'text';
  nameInput.id = 'nameInput';
  nameInput.maxLength = namePolicy.maxLength;
  nameInput.value = conversation.name;
  nameField.appendChild(nameInput);
  var nameHint = el('p', 'hint', namePolicy.summary);
  nameField.appendChild(nameHint);
  identityBody.appendChild(nameField);

  var topicField = el('div', 'field');
  topicField.style.marginBottom = '0';
  var topicLabel = el('label', 'label', 'Topic');
  topicLabel.htmlFor = 'topicInput';
  topicField.appendChild(topicLabel);
  var topicInput = el('textarea', 'textarea');
  topicInput.id = 'topicInput';
  topicInput.rows = 2;
  topicInput.maxLength = topicPolicy.maxLength;
  topicInput.value = conversation.topic || '';
  topicField.appendChild(topicInput);
  var topicHint = el('p', 'hint', topicPolicy.summary);
  topicField.appendChild(topicHint);
  identityBody.appendChild(topicField);

  identityPanel.appendChild(identityBody);

  var identityFoot = el('div', 'panel__foot row row--between');
  var identityStatus = el('span', 'small muted', '');
  identityFoot.appendChild(identityStatus);
  var saveIdentity = el('button', 'btn btn--primary btn--sm', 'Save');
  saveIdentity.type = 'button';
  saveIdentity.setAttribute('aria-disabled', 'true');
  identityFoot.appendChild(saveIdentity);
  identityPanel.appendChild(identityFoot);
  page.appendChild(identityPanel);

  function identityDirty() {
    return nameInput.value.trim() !== conversation.name
      || topicInput.value.trim() !== (conversation.topic || '');
  }

  function refreshIdentityState() {
    if (identityDirty()) {
      saveIdentity.removeAttribute('aria-disabled');
      identityStatus.textContent = 'Unsaved changes';
    } else {
      saveIdentity.setAttribute('aria-disabled', 'true');
      identityStatus.textContent = '';
    }
  }

  nameInput.addEventListener('input', function () {
    nameHint.textContent = namePolicy.summary;
    nameHint.classList.remove('hint--error');
    refreshIdentityState();
  });

  topicInput.addEventListener('input', function () {
    var remaining = topicPolicy.maxLength - topicInput.value.length;
    topicHint.textContent = topicInput.value.length
      ? remaining + ' characters left'
      : topicPolicy.summary;
    topicHint.classList.remove('hint--error');
    refreshIdentityState();
  });

  saveIdentity.addEventListener('click', async function () {
    saveIdentity.setAttribute('aria-disabled', 'true');

    if (nameInput.value.trim() !== conversation.name) {
      var renamed = await SettingsApi.renameConversation(conversation.id, nameInput.value);
      if (!renamed.renamed) {
        nameHint.textContent = renamed.reason;
        nameHint.classList.add('hint--error');
        saveIdentity.removeAttribute('aria-disabled');
        return;
      }
      conversation.name = renamed.name;
      nameInput.value = renamed.name;
    }

    if (topicInput.value.trim() !== (conversation.topic || '')) {
      var described = await SettingsApi.updateConversationTopic(conversation.id, topicInput.value);
      if (!described.updated) {
        topicHint.textContent = described.reason;
        topicHint.classList.add('hint--error');
        saveIdentity.removeAttribute('aria-disabled');
        return;
      }
      conversation.topic = described.topic;
      topicInput.value = described.topic;
    }

    refreshIdentityState();
    identityStatus.textContent = 'Saved';
    toast('Name and topic updated. The tags, and who can reach this conversation, are unchanged.');
  });

  /* ---- tags ---- */

  var tagPanel = el('div', 'panel settings-col section');
  var tagHead = el('div', 'panel__head');
  tagHead.appendChild(el('h2', 'panel__title', 'Tags'));
  tagPanel.appendChild(tagHead);

  var tagBody = el('div', 'panel__body');
  var tagbox = el('div', 'tagbox');
  var input = el('input', 'tagbox__input');
  input.type = 'text';
  input.placeholder = 'Add a tag and press Enter';
  input.autocomplete = 'off';
  input.spellcheck = false;
  tagbox.appendChild(input);
  tagBody.appendChild(tagbox);
  var tagHint = el('p', 'hint', policy.summary);
  tagBody.appendChild(tagHint);

  if (!conversation.listed) {
    var warn = el('div', 'callout callout--warning');
    warn.style.marginTop = '16px';
    warn.appendChild(el('span', 'callout__icon', '!'));
    warn.appendChild(el('div', '', 'This conversation is unlisted, so its tags are the only way in. Anyone holding the old combination will no longer be able to join once you change it, and current members are unaffected.'));
    tagBody.appendChild(warn);
  }

  tagPanel.appendChild(tagBody);
  var tagFoot = el('div', 'panel__foot');
  var tagCount = el('span', 'tag-count');
  tagFoot.appendChild(tagCount);
  tagPanel.appendChild(tagFoot);
  page.appendChild(tagPanel);

  function renderTags() {
    Array.prototype.slice.call(tagbox.querySelectorAll('.tag')).forEach(function (node) { node.remove(); });
    conversation.tags.forEach(function (value) {
      var pill = el('span', 'tag', value);
      var remove = el('button', 'tag__x', '×');
      remove.type = 'button';
      remove.title = 'Remove ' + value;
      remove.addEventListener('click', async function () {
        var outcome = await SettingsApi.removeConversationTag(conversation.id, value);
        if (!outcome.removed) { tagHint.textContent = outcome.reason; tagHint.classList.add('hint--error'); return; }
        conversation.tags = outcome.tags;
        tagHint.textContent = policy.summary;
        tagHint.classList.remove('hint--error');
        renderTags();
        toast('Removed “' + value + '”.');
      });
      pill.appendChild(remove);
      tagbox.insertBefore(pill, input);
    });
    tagCount.textContent = conversation.tags.length + ' of ' + policy.maxTags + ' tags used';
    input.disabled = conversation.tags.length >= policy.maxTags;
    input.placeholder = input.disabled ? 'Tag limit reached' : 'Add a tag and press Enter';
  }

  input.addEventListener('keydown', async function (event) {
    if (event.key !== 'Enter') { return; }
    event.preventDefault();
    var outcome = await SettingsApi.addConversationTag(conversation.id, input.value);
    if (!outcome.added) {
      tagHint.textContent = outcome.reason;
      tagHint.classList.add('hint--error');
      return;
    }
    conversation.tags = outcome.tags;
    input.value = '';
    tagHint.textContent = policy.summary;
    tagHint.classList.remove('hint--error');
    renderTags();
    toast('Tag added.');
  });

  tagbox.addEventListener('click', function () { if (!input.disabled) { input.focus(); } });

  renderTags();

  /* ---- visibility and matching ---- */

  var visPanel = el('div', 'panel settings-col section');
  var visHead = el('div', 'panel__head');
  visHead.appendChild(el('h2', 'panel__title', 'Visibility'));
  visPanel.appendChild(visHead);
  var visBody = el('div', 'panel__body');

  function fact(key, value) {
    var row = el('div', 'fact');
    row.appendChild(el('span', 'fact__key', key));
    row.appendChild(el('span', '', value));
    visBody.appendChild(row);
  }

  fact('Listing', conversation.listed ? 'Listed — appears in tag search' : 'Unlisted — never named in search');
  fact('Members', conversation.memberCount + ' active');
  fact('Created', conversation.createdOn);

  visBody.appendChild(el('p', 'hint', 'A conversation keeps the listing it was created with. Everything about how it is reached is decided by its tags.'));

  if (conversation.listed) {
    var matchWrap = el('div', '');
    matchWrap.style.marginTop = '20px';
    matchWrap.appendChild(el('span', 'label', 'How a search matches it'));
    matchingOptions.forEach(function (option) {
      var label = el('label', 'choice');
      label.dataset.matching = option.id;
      var radio = el('input');
      radio.type = 'radio';
      radio.name = 'matching';
      radio.value = option.id;
      radio.checked = option.id === conversation.matching;
      var body = el('div', '');
      body.appendChild(el('div', 'choice__title', option.title));
      body.appendChild(el('div', 'choice__desc', option.description));
      label.appendChild(radio);
      label.appendChild(body);
      if (option.id === conversation.matching) { label.classList.add('is-selected'); }
      radio.addEventListener('change', async function () {
        var outcome = await SettingsApi.updateMatchingMode(conversation.id, option.id);
        if (!outcome.updated) { toast(outcome.reason, 'danger'); return; }
        conversation.matching = outcome.matching;
        Array.prototype.slice.call(matchWrap.querySelectorAll('.choice')).forEach(function (node) {
          node.classList.toggle('is-selected', node.dataset.matching === conversation.matching);
        });
        toast(option.id === 'exclusive'
          ? 'Search now has to include all of its tags.'
          : 'Any one of its tags will now find it.');
      });
      matchWrap.appendChild(label);
    });
    visBody.appendChild(matchWrap);
  } else {
    var fixed = el('div', 'callout');
    fixed.style.marginTop = '18px';
    fixed.appendChild(el('span', 'callout__icon', 'i'));
    fixed.appendChild(el('div', '', 'An unlisted conversation always requires every one of its tags, so there is no matching choice to make.'));
    visBody.appendChild(fixed);
  }

  visPanel.appendChild(visBody);
  page.appendChild(visPanel);

  /* ---- archive ---- */

  var archivePanel = el('div', 'panel settings-col section');
  var archiveHead = el('div', 'panel__head');
  archiveHead.appendChild(el('h2', 'panel__title', 'Archive'));
  archivePanel.appendChild(archiveHead);
  var archiveBody = el('div', 'panel__body');
  archiveBody.appendChild(el('p', 'hint', 'Archiving ends active use of this conversation. Its messages, memberships, tags, and reports are all retained. Tawk has no way to delete a conversation outright, and this is deliberate.'));

  var archiveRow = el('div', 'row');
  archiveRow.style.marginTop = '16px';
  var archiveButton = el('button', 'btn btn--danger', conversation.archived ? 'Already archived' : 'Archive conversation');
  archiveButton.type = 'button';
  if (!isOwner || conversation.archived) {
    archiveButton.setAttribute('aria-disabled', 'true');
  } else {
    archiveButton.addEventListener('click', confirmArchive);
  }
  archiveRow.appendChild(archiveButton);
  if (!isOwner) {
    archiveRow.appendChild(el('span', 'small muted', 'Only an owner can archive a conversation.'));
  }
  archiveBody.appendChild(archiveRow);
  archivePanel.appendChild(archiveBody);
  page.appendChild(archivePanel);

  function confirmArchive() {
    var body = el('div', '');
    var callout = el('div', 'callout callout--warning');
    callout.appendChild(el('span', 'callout__icon', '!'));
    callout.appendChild(el('div', '', 'Nothing is deleted. Messages, membership history, tags, and reports stay exactly as they are.'));
    body.appendChild(callout);
    body.appendChild(el('p', 'hint', 'This is how a conversation ends in Tawk. As the only owner you can archive it instead of handing ownership to someone else.'));

    openModal({
      title: 'Archive this conversation?',
      body: body,
      actions: [
        { label: 'Cancel', onClick: closeModal },
        {
          label: 'Archive',
          className: 'btn--solid-danger',
          onClick: async function (button) {
            button.setAttribute('aria-disabled', 'true');
            var outcome = await SettingsApi.archiveConversation(conversation.id);
            if (!outcome.archived) {
              button.removeAttribute('aria-disabled');
              toast(outcome.reason, 'danger');
              return;
            }
            conversation.archived = true;
            closeModal();
            archiveButton.textContent = 'Already archived';
            archiveButton.setAttribute('aria-disabled', 'true');
            toast('Conversation archived. Everything it holds is retained.');
          }
        }
      ]
    });
  }
})();
</script>

</body>
</html>
