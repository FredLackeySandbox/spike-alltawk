<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation · Tawk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .conv-head { padding: 26px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .conv-head__name { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 4px; }
  .conv-head__topic { font-size: 14px; color: var(--ink-2); margin: 0 0 12px; max-width: 74ch; }
  .conv-head__meta { font-size: 12.5px; color: var(--muted); margin-top: 8px; display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  .picker { position: fixed; z-index: 90; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 6px; display: flex; gap: 3px; }
  .picker button { border: none; background: none; font-size: 17px; line-height: 1; padding: 5px 6px; border-radius: 5px; cursor: pointer; }
  .picker button:hover { background: var(--surface-2); }
  .conv-note { margin-bottom: 18px; }
  .mention { font-weight: 600; color: var(--primary-dark); background: var(--primary-soft); border-radius: 4px; padding: 0 3px; }
  .mention--me { color: #7a4a05; background: var(--warning-soft); }
  .msg--mentions-me { box-shadow: inset 3px 0 0 var(--warning); background: #fffdf8; }
  .msg--mentions-me:hover { background: #fffaf0; }
  .people { position: fixed; z-index: 90; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 5px; min-width: 280px; max-height: 240px; overflow-y: auto; }
  .people__item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: none; padding: 7px 9px; border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 13.5px; color: var(--ink); }
  .people__item:hover, .people__item.is-active { background: var(--primary-soft); }
  .people__handle { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .people__empty { padding: 10px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="../index.html"><span class="brand__mark">T</span> Tawk</a>
    <nav class="topnav">
      <a href="../hub/conversations.html">Conversations</a>
      <a href="../hub/find-conversations.html">Find</a>
      <a href="../bots/bots.html">Bots</a>
    </nav>
    <div class="spacer"></div>
    <span class="whoami"><span class="avatar avatar--sm" id="meInitials"></span><span id="meName"></span></span>
  </div>
</div>

<main class="app">
  <div id="page"></div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<div class="toast-host" id="toastHost"></div>

<script src="conversation-api.js"></script>
<script>
(async function () {
  'use strict';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  function toast(message, variant) {
    var host = document.getElementById('toastHost');
    var node = el('div', 'toast' + (variant ? ' toast--' + variant : ''), message);
    host.appendChild(node);
    setTimeout(function () { node.remove(); }, 3600);
  }

  var backdrop = document.getElementById('modalBackdrop');
  var modal = document.getElementById('modal');

  function closeModal() {
    backdrop.classList.remove('is-open');
    modal.innerHTML = '';
  }

  backdrop.addEventListener('click', function (event) {
    if (event.target === backdrop) { closeModal(); }
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') { closeModal(); closePicker(); }
  });

  /**
   * Open a modal built from a title, a body node, and footer buttons.
   */
  function openModal(options) {
    modal.innerHTML = '';
    var head = el('div', 'modal__head');
    head.appendChild(el('h2', 'modal__title', options.title));
    if (options.subtitle) { head.appendChild(el('p', 'modal__sub', options.subtitle)); }
    modal.appendChild(head);

    var body = el('div', 'modal__body');
    body.appendChild(options.body);
    modal.appendChild(body);

    var foot = el('div', 'modal__foot');
    (options.actions || []).forEach(function (action) {
      var button = el('button', 'btn ' + (action.className || ''), action.label);
      button.type = 'button';
      button.addEventListener('click', function () { action.onClick(button); });
      foot.appendChild(button);
    });
    modal.appendChild(foot);
    backdrop.classList.add('is-open');
    if (options.focus) {
      var field = modal.querySelector('textarea, input');
      if (field) { field.focus(); }
    }
  }

  var picker = null;
  function closePicker() {
    if (picker) { picker.remove(); picker = null; }
  }
  document.addEventListener('click', function (event) {
    if (picker && !picker.contains(event.target)) { closePicker(); }
  });

  /* ---------------------------------------------------------------- */

  var params = new URLSearchParams(window.location.search);
  var conversationId = params.get('id') || 'c-kiln';

  var me = await ConversationApi.getSignedInIdentity();
  document.getElementById('meInitials').textContent = me.initials;
  document.getElementById('meName').textContent = me.displayName;

  var palette = await ConversationApi.getReactionPalette();
  var conversation = await ConversationApi.getConversation(conversationId);
  var page = document.getElementById('page');

  if (!conversation) {
    var missing = el('div', 'panel');
    var missingBody = el('div', 'empty');
    missingBody.appendChild(el('div', 'empty__title', 'This conversation is not available to you'));
    missingBody.appendChild(el('div', '', 'You may have left it, or it may never have been yours to read.'));
    var back = el('a', 'btn', 'Back to your conversations');
    back.href = '../hub/conversations.html';
    back.style.marginTop = '16px';
    missingBody.appendChild(back);
    missing.appendChild(missingBody);
    page.appendChild(missing);
    return;
  }

  var isModerator = conversation.myRole === 'owner' || conversation.myRole === 'administrator';

  /* ---- header ---- */

  var head = el('div', 'conv-head');
  var headRow = el('div', 'row row--between row--top');

  var headLeft = el('div', '');
  headLeft.appendChild(el('h1', 'conv-head__name', conversation.name));
  if (conversation.topic) {
    headLeft.appendChild(el('p', 'conv-head__topic', conversation.topic));
  }

  var tags = el('div', 'tags');
  conversation.tags.forEach(function (value) { tags.appendChild(el('span', 'tag', value)); });
  headLeft.appendChild(tags);

  var meta = el('div', 'conv-head__meta');
  meta.appendChild(el('span', '', conversation.listed
    ? (conversation.matching === 'exclusive' ? 'Listed · all tags must match' : 'Listed')
    : 'Unlisted · all tags required to join'));
  meta.appendChild(el('span', '', '·'));
  meta.appendChild(el('span', '', conversation.memberCount + (conversation.memberCount === 1 ? ' member' : ' members')));
  meta.appendChild(el('span', 'badge badge--' + (conversation.myRole === 'owner' ? 'owner' : conversation.myRole === 'administrator' ? 'admin' : 'muted'),
    conversation.myRole === 'owner' ? 'Owner' : conversation.myRole === 'administrator' ? 'Administrator' : 'Member'));
  if (conversation.kind === 'moderation-discussion') {
    meta.appendChild(el('span', 'badge badge--warning', 'Moderation discussion · Report #' + conversation.linkedTicket));
  }
  headLeft.appendChild(meta);
  headRow.appendChild(headLeft);

  var headRight = el('div', 'row');
  if (isModerator) {
    var membersLink = el('a', 'btn btn--sm', 'Members');
    membersLink.href = '../governance/members.html?id=' + encodeURIComponent(conversation.id);
    headRight.appendChild(membersLink);

    var settingsLink = el('a', 'btn btn--sm', 'Settings');
    settingsLink.href = '../governance/settings.html?id=' + encodeURIComponent(conversation.id);
    headRight.appendChild(settingsLink);

    var reportsLink = el('a', 'btn btn--sm', 'Reports');
    reportsLink.href = '../moderation/reports.html';
    headRight.appendChild(reportsLink);
  }
  var leaveButton = el('button', 'btn btn--sm btn--ghost', 'Leave');
  leaveButton.type = 'button';
  leaveButton.addEventListener('click', confirmLeave);
  headRight.appendChild(leaveButton);
  headRow.appendChild(headRight);

  head.appendChild(headRow);
  page.appendChild(head);

  var noteHost = el('div', 'conv-note');
  page.appendChild(noteHost);

  if (conversation.note) { renderConversationNote(conversation.note); }

  function renderConversationNote(note) {
    noteHost.innerHTML = '';
    var callout = el('div', 'callout callout--warning');
    callout.appendChild(el('span', 'callout__icon', '✎'));
    var body = el('div', '');
    body.appendChild(el('div', 'strong', 'Note from ' + note.authorName));
    body.appendChild(el('div', '', note.body));
    callout.appendChild(body);
    noteHost.appendChild(callout);
  }

  /* ---- thread ---- */

  var panel = el('div', 'panel');
  var thread = el('div', 'thread');
  panel.appendChild(thread);

  var composer = el('div', 'composer');
  var composerRow = el('div', 'composer__row');
  var textarea = el('textarea', 'textarea');
  textarea.placeholder = 'Write a message, or use @ to address someone';
  textarea.rows = 1;
  composerRow.appendChild(textarea);

  var noteButton = el('button', 'btn', 'Add note');
  noteButton.type = 'button';
  noteButton.addEventListener('click', function () { openNoteModal(null); });
  composerRow.appendChild(noteButton);

  var sendButton = el('button', 'btn btn--primary', 'Send');
  sendButton.type = 'button';
  composerRow.appendChild(sendButton);
  composer.appendChild(composerRow);
  panel.appendChild(composer);
  page.appendChild(panel);

  var messages = await ConversationApi.getConversationMessages(conversation.id);
  renderThread();

  function renderThread() {
    thread.innerHTML = '';
    if (!messages.length) {
      var empty = el('div', 'empty');
      empty.appendChild(el('div', 'empty__title', 'Nothing has been said here yet'));
      empty.appendChild(el('div', '', 'You created this conversation, so the first message is yours.'));
      thread.appendChild(empty);
      return;
    }
    messages.forEach(function (message) { thread.appendChild(renderMessage(message)); });
    thread.scrollTop = thread.scrollHeight;
  }

  /**
   * Build the message body as text nodes plus mention chips, so a handle is
   * only ever styled when the API resolved it to a real participant.
   */
  function renderText(message) {
    var paragraph = el('p', 'msg__text');
    var handles = {};
    message.mentions.forEach(function (mention) { handles[mention.handle] = mention; });

    var pattern = /@([a-z0-9]+(?:-[a-z0-9]+)*)/g;
    var text = message.text;
    var lastIndex = 0;
    var match;

    while ((match = pattern.exec(text)) !== null) {
      var mention = handles[match[1]];
      if (!mention) { continue; }
      if (match.index > lastIndex) {
        paragraph.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
      }
      var isMe = mention.identityId === me.id;
      var chip = el('span', 'mention' + (isMe ? ' mention--me' : ''), '@' + mention.handle);
      chip.title = mention.displayName + (mention.type === 'bot' ? ' (bot)' : '');
      paragraph.appendChild(chip);
      lastIndex = match.index + match[0].length;
    }

    if (lastIndex < text.length) {
      paragraph.appendChild(document.createTextNode(text.slice(lastIndex)));
    }
    return paragraph;
  }

  function renderMessage(message) {
    var isFormer = message.author.standing === 'former';
    var row = el('div', 'msg' + (isFormer ? ' msg--former' : '') + (message.mentionsMe ? ' msg--mentions-me' : ''));

    var avatarClass = 'avatar' + (message.author.type === 'bot' ? ' avatar--bot' : '') + (isFormer ? ' avatar--gone' : '');
    row.appendChild(el('div', avatarClass, message.author.initials));

    var body = el('div', 'msg__body');
    var headLine = el('div', 'msg__head');
    headLine.appendChild(el('span', 'msg__author', message.author.displayName));
    if (message.author.type === 'bot') { headLine.appendChild(el('span', 'badge badge--bot', 'Bot')); }
    if (isFormer) { headLine.appendChild(el('span', 'badge badge--muted', 'Left this conversation')); }
    headLine.appendChild(el('span', 'msg__time', message.time));
    if (message.mentionsMe) { headLine.appendChild(el('span', 'badge badge--warning', 'Mentions you')); }
    body.appendChild(headLine);
    body.appendChild(renderText(message));

    var reactions = el('div', 'reactions');
    message.reactions.forEach(function (reaction) {
      var chip = el('button', 'reaction' + (reaction.mine ? ' is-mine' : ''));
      chip.type = 'button';
      chip.title = reaction.names.join(', ');
      chip.appendChild(el('span', '', reaction.emoji));
      chip.appendChild(el('span', 'reaction__count', String(reaction.count)));
      chip.addEventListener('click', function () { react(message, reaction.emoji); });
      reactions.appendChild(chip);
    });
    if (message.reactions.length) {
      var add = el('button', 'reaction reaction--add', '+');
      add.type = 'button';
      add.title = 'Add a reaction';
      add.addEventListener('click', function (event) { openPicker(event.currentTarget, message); });
      reactions.appendChild(add);
      body.appendChild(reactions);
    }

    if (message.note) {
      var note = el('div', 'note-chip');
      note.appendChild(el('span', '', '✎'));
      var noteBody = el('div', '');
      noteBody.appendChild(el('div', 'strong', message.note.authorName));
      noteBody.appendChild(el('div', '', message.note.body));
      note.appendChild(noteBody);
      body.appendChild(note);
    }

    row.appendChild(body);

    var actions = el('div', 'msg__actions');

    var reactAction = el('button', 'msg__action', 'React');
    reactAction.type = 'button';
    reactAction.addEventListener('click', function (event) { openPicker(event.currentTarget, message); });
    actions.appendChild(reactAction);

    var noteAction = el('button', 'msg__action', 'Note');
    noteAction.type = 'button';
    noteAction.addEventListener('click', function () { openNoteModal(message); });
    actions.appendChild(noteAction);

    if (!message.isMine) {
      var flagAction = el('button', 'msg__action', 'Flag');
      flagAction.type = 'button';
      flagAction.addEventListener('click', function () { openFlagModal(message); });
      actions.appendChild(flagAction);
    }

    if (message.isMine || isModerator) {
      var deleteAction = el('button', 'msg__action msg__action--danger', 'Delete');
      deleteAction.type = 'button';
      deleteAction.addEventListener('click', function () { confirmDelete(message); });
      actions.appendChild(deleteAction);
    }

    row.appendChild(actions);
    return row;
  }

  /* ---- interactions ---- */

  function openPicker(anchor, message) {
    closePicker();
    var box = anchor.getBoundingClientRect();
    picker = el('div', 'picker');
    palette.forEach(function (emoji) {
      var button = el('button', '', emoji);
      button.type = 'button';
      button.addEventListener('click', function () {
        closePicker();
        react(message, emoji);
      });
      picker.appendChild(button);
    });
    document.body.appendChild(picker);
    var width = picker.offsetWidth;
    picker.style.top = (box.bottom + 6) + 'px';
    picker.style.left = Math.max(12, Math.min(box.left, window.innerWidth - width - 12)) + 'px';
  }

  async function react(message, emoji) {
    var updated = await ConversationApi.toggleMessageReaction(conversation.id, message.id, emoji);
    messages = messages.map(function (item) { return item.id === updated.id ? updated : item; });
    renderThread();
  }

  function openNoteModal(message) {
    var body = el('div', '');
    var label = el('label', 'label', message ? 'Note on this message' : 'Note on this conversation');
    label.htmlFor = 'noteBody';
    body.appendChild(label);
    var field = el('textarea', 'textarea');
    field.id = 'noteBody';
    field.placeholder = message
      ? 'Something worth remembering about this message.'
      : 'Something worth remembering about this conversation.';
    if (message && message.note) { field.value = message.note.body; }
    body.appendChild(field);
    if (message) {
      var quoted = el('p', 'hint', '“' + message.text.slice(0, 120) + (message.text.length > 120 ? '…' : '') + '”');
      body.appendChild(quoted);
    }

    openModal({
      title: 'Add a note',
      subtitle: 'Notes are attributed to you and stay with what they are attached to.',
      body: body,
      focus: true,
      actions: [
        { label: 'Cancel', onClick: closeModal },
        {
          label: 'Save note',
          className: 'btn--primary',
          onClick: async function (button) {
            button.setAttribute('aria-disabled', 'true');
            var outcome = await ConversationApi.addNote(conversation.id, {
              messageId: message ? message.id : null,
              body: field.value
            });
            if (!outcome.saved) {
              button.removeAttribute('aria-disabled');
              toast(outcome.reason, 'danger');
              return;
            }
            if (message) {
              messages = messages.map(function (item) {
                if (item.id === message.id) { item.note = outcome.note; }
                return item;
              });
              renderThread();
            } else {
              renderConversationNote(outcome.note);
            }
            closeModal();
            toast('Note saved.');
          }
        }
      ]
    });
  }

  function openFlagModal(message) {
    var body = el('div', '');
    var quote = el('div', 'callout');
    var quoteBody = el('div', '');
    quoteBody.appendChild(el('div', 'strong', message.author.displayName));
    quoteBody.appendChild(el('div', 'small', message.text));
    quote.appendChild(quoteBody);
    body.appendChild(quote);

    var label = el('label', 'label', 'What is wrong with it?');
    label.htmlFor = 'flagReason';
    label.style.marginTop = '18px';
    body.appendChild(label);
    var field = el('textarea', 'textarea');
    field.id = 'flagReason';
    field.placeholder = 'The reviewers see this, so be specific.';
    body.appendChild(field);
    var error = el('p', 'hint hint--error');
    body.appendChild(error);

    openModal({
      title: 'Flag this message',
      subtitle: 'This opens a numbered report for the owners and administrators of this conversation.',
      body: body,
      focus: true,
      actions: [
        { label: 'Cancel', onClick: closeModal },
        {
          label: 'Submit report',
          className: 'btn--primary',
          onClick: async function (button) {
            error.textContent = '';
            button.setAttribute('aria-disabled', 'true');
            var outcome = await ConversationApi.flagMessage(conversation.id, message.id, field.value);
            button.removeAttribute('aria-disabled');
            if (!outcome.flagged) {
              error.textContent = outcome.reason;
              return;
            }
            closeModal();
            toast('Report #' + outcome.ticketNumber + ' opened. The reviewers of this conversation can see it.', 'success');
          }
        }
      ]
    });
  }

  function confirmDelete(message) {
    var asModerator = !message.isMine;
    var body = el('div', '');
    var quote = el('div', 'callout');
    var quoteBody = el('div', '');
    quoteBody.appendChild(el('div', 'strong', message.author.displayName));
    quoteBody.appendChild(el('div', 'small', message.text));
    quote.appendChild(quoteBody);
    body.appendChild(quote);
    var explain = el('p', 'hint', 'It disappears from the conversation for everyone. No placeholder is left behind, and the record is retained rather than erased.');
    body.appendChild(explain);

    openModal({
      title: asModerator ? 'Delete this message as a moderator?' : 'Delete your message?',
      body: body,
      actions: [
        { label: 'Cancel', onClick: closeModal },
        {
          label: 'Delete',
          className: 'btn--solid-danger',
          onClick: async function (button) {
            button.setAttribute('aria-disabled', 'true');
            var outcome = await ConversationApi.deleteMessage(conversation.id, message.id);
            if (!outcome.deleted) {
              button.removeAttribute('aria-disabled');
              toast(outcome.reason, 'danger');
              return;
            }
            messages = messages.filter(function (item) { return item.id !== message.id; });
            renderThread();
            closeModal();
            toast(outcome.asModerator ? 'Message deleted as a moderation action.' : 'Message deleted.');
          }
        }
      ]
    });
  }

  async function confirmLeave() {
    var outcome = await ConversationApi.leaveConversation(conversation.id);
    if (!outcome.left) {
      var body = el('div', '');
      var callout = el('div', 'callout callout--warning');
      callout.appendChild(el('span', 'callout__icon', '!'));
      callout.appendChild(el('div', '', outcome.reason));
      body.appendChild(callout);

      openModal({
        title: 'You cannot leave yet',
        body: body,
        actions: [
          { label: 'Close', onClick: closeModal },
          {
            label: 'Manage owners',
            className: 'btn--primary',
            onClick: function () {
              window.location.href = '../governance/members.html?id=' + encodeURIComponent(conversation.id);
            }
          }
        ]
      });
      return;
    }
    toast('You left this conversation. Your messages stay where they are.');
    setTimeout(function () { window.location.href = '../hub/conversations.html'; }, 700);
  }

  /* ---- composer ---- */

  async function send() {
    var text = textarea.value.trim();
    if (!text) { return; }
    sendButton.setAttribute('aria-disabled', 'true');
    var posted = await ConversationApi.postMessage(conversation.id, text);
    messages.push(posted);
    textarea.value = '';
    textarea.style.height = 'auto';
    closePeople();
    sendButton.removeAttribute('aria-disabled');
    renderThread();
    if (posted.mentions.length) {
      toast('Addressed ' + posted.mentions.map(function (m) { return m.displayName; }).join(', ') + '.');
    }
  }

  /* ---- @mentions ---- */

  var participants = await ConversationApi.getConversationParticipants(conversation.id);
  var peopleMenu = null;
  var peopleMatches = [];
  var peopleActive = -1;
  var mentionStart = -1;

  function closePeople() {
    if (peopleMenu) { peopleMenu.remove(); peopleMenu = null; }
    peopleMatches = [];
    peopleActive = -1;
    mentionStart = -1;
  }

  document.addEventListener('click', function (event) {
    if (peopleMenu && !peopleMenu.contains(event.target) && event.target !== textarea) { closePeople(); }
  });

  /**
   * Find the handle fragment being typed immediately before the caret, if any.
   */
  function activeMentionFragment() {
    var upToCaret = textarea.value.slice(0, textarea.selectionStart);
    var match = /(^|\s)@([a-z0-9-]*)$/i.exec(upToCaret);
    if (!match) { return null; }
    return {
      fragment: match[2].toLowerCase(),
      start: upToCaret.length - match[2].length - 1
    };
  }

  function refreshPeople() {
    var active = activeMentionFragment();
    if (!active) { closePeople(); return; }

    mentionStart = active.start;
    peopleMatches = participants.filter(function (person) {
      if (person.id === me.id) { return false; }
      return !active.fragment
        || person.handle.indexOf(active.fragment) !== -1
        || person.displayName.toLowerCase().indexOf(active.fragment) !== -1;
    });

    if (!peopleMenu) {
      peopleMenu = el('div', 'people');
      document.body.appendChild(peopleMenu);
    }
    peopleMenu.innerHTML = '';

    if (!peopleMatches.length) {
      peopleMenu.appendChild(el('div', 'people__empty', 'Nobody in this conversation matches “' + active.fragment + '”.'));
    } else {
      peopleMatches.forEach(function (person, index) {
        var item = el('button', 'people__item' + (index === 0 ? ' is-active' : ''));
        item.type = 'button';
        item.appendChild(el('span', 'avatar avatar--sm' + (person.type === 'bot' ? ' avatar--bot' : ''), person.initials));
        item.appendChild(el('span', '', person.displayName));
        item.appendChild(el('span', 'people__handle', '@' + person.handle));
        item.addEventListener('mousedown', function (event) {
          event.preventDefault();
          acceptMention(person);
        });
        peopleMenu.appendChild(item);
      });
      peopleActive = 0;
    }

    var box = textarea.getBoundingClientRect();
    peopleMenu.style.left = box.left + 'px';
    peopleMenu.style.top = 'auto';
    peopleMenu.style.bottom = (window.innerHeight - box.top + 6) + 'px';
  }

  function moveActivePerson(step) {
    var items = Array.prototype.slice.call(peopleMenu.querySelectorAll('.people__item'));
    if (!items.length) { return; }
    items.forEach(function (item) { item.classList.remove('is-active'); });
    peopleActive = (peopleActive + step + items.length) % items.length;
    items[peopleActive].classList.add('is-active');
    items[peopleActive].scrollIntoView({ block: 'nearest' });
  }

  function acceptMention(person) {
    var before = textarea.value.slice(0, mentionStart);
    var after = textarea.value.slice(textarea.selectionStart);
    var inserted = '@' + person.handle + ' ';
    textarea.value = before + inserted + after;
    var caret = before.length + inserted.length;
    closePeople();
    textarea.focus();
    textarea.setSelectionRange(caret, caret);
  }

  sendButton.addEventListener('click', send);

  textarea.addEventListener('keydown', function (event) {
    if (peopleMenu) {
      if (event.key === 'ArrowDown') { event.preventDefault(); moveActivePerson(1); return; }
      if (event.key === 'ArrowUp') { event.preventDefault(); moveActivePerson(-1); return; }
      if (event.key === 'Escape') { event.preventDefault(); closePeople(); return; }
      if ((event.key === 'Enter' || event.key === 'Tab') && peopleMatches[peopleActive]) {
        event.preventDefault();
        acceptMention(peopleMatches[peopleActive]);
        return;
      }
    }
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });

  textarea.addEventListener('input', function () {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
    refreshPeople();
  });

  textarea.addEventListener('blur', function () {
    setTimeout(closePeople, 120);
  });
})();
</script>

</body>
</html>
