$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/emoji-reaction.schema.json"
title: "Emoji Reaction"
description: "A retained association between a message, a reacting identity, and an emoji."
type: object
additionalProperties: false
required:
  - id
  - messageId
  - conversationId
  - identityId
  - emoji
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for this emoji reaction."
  messageId:
    type: string
    format: uuid
    description: "Message receiving the reaction."
  conversationId:
    type: string
    format: uuid
    description: "Conversation copied onto the reaction for authorization and DynamoDB query access."
  identityId:
    type: string
    format: uuid
    description: "Active participant that added the reaction."
  emoji:
    type: string
    minLength: 1
    maxLength: 64
    description: "Emoji or supported reaction code; the allowed set remains a product decision."
  removedAt:
    type: string
    format: date-time
    description: "When the reaction was withdrawn and soft-removed, if applicable."
  createdAt:
    type: string
    format: date-time
    description: "When this reaction was added."
  updatedAt:
    type: string
    format: date-time
    description: "When this reaction record was last updated."
