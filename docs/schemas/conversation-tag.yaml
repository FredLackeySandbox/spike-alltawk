$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://tawk.local/schemas/conversation-tag.schema.json"
title: "Conversation Tag"
description: "A temporal association between a conversation and one of its one-to-ten assigned tags."
type: object
additionalProperties: false
required:
  - id
  - conversationId
  - tagId
  - assignedById
  - effectiveFrom
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for the conversation-tag association."
  conversationId:
    type: string
    format: uuid
    description: "Conversation receiving the tag, referencing conversation.yaml."
  tagId:
    type: string
    format: uuid
    description: "Shared normalized tag assigned to the conversation, referencing tag.yaml."
  assignedById:
    type: string
    format: uuid
    description: "Owner or administrator identity that assigned the tag, referencing identity.yaml."
  effectiveFrom:
    type: string
    format: date-time
    description: "When the tag assignment became effective."
  effectiveTo:
    type: string
    format: date-time
    description: "When the assignment ended; omission means the tag is currently assigned."
  removedById:
    type: string
    format: uuid
    description: "Owner or administrator identity that ended the assignment, referencing identity.yaml."
  createdAt:
    type: string
    format: date-time
    description: "When this association record was created."
  updatedAt:
    type: string
    format: date-time
    description: "When this association record was last updated."
allOf:
  - if:
      required: [effectiveTo]
    then:
      required: [removedById]
  - if:
      not:
        required: [effectiveTo]
    then:
      not:
        required: [removedById]
