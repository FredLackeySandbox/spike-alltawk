$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/moderation-ticket.schema.json"
title: "Moderation Ticket"
description: "A numbered report of a message that owners and administrators can review and resolve."
type: object
additionalProperties: false
required:
  - id
  - ticketNumber
  - conversationId
  - messageId
  - reportingIdentityId
  - reason
  - status
  - reportedAt
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for this moderation ticket."
  ticketNumber:
    type: integer
    minimum: 1
    description: "Application-unique human-readable number assigned to the ticket."
  conversationId:
    type: string
    format: uuid
    description: "Conversation containing the reported message and governing moderator access."
  messageId:
    type: string
    format: uuid
    description: "Message reported by the participant."
  reportingIdentityId:
    type: string
    format: uuid
    description: "Participant that submitted the report."
  reason:
    type: string
    minLength: 1
    maxLength: 4000
    description: "Participant-provided explanation of what is offensive, incorrect, or concerning."
  status:
    type: string
    enum:
      - open
      - inReview
      - resolved
      - closed
    description: "Provisional workflow state pending a final ticket-status decision."
  assignedToIdentityId:
    type: string
    format: uuid
    description: "Owner or administrator currently responsible for review, if assignment is used."
  reportedAt:
    type: string
    format: date-time
    description: "When the participant submitted the report."
  resolvedAt:
    type: string
    format: date-time
    description: "When moderators completed a resolution, if applicable."
  resolvedById:
    type: string
    format: uuid
    description: "Owner or administrator that resolved the ticket, if applicable."
  resolutionSummary:
    type: string
    maxLength: 4000
    description: "Optional concise explanation of the ticket outcome."
  createdAt:
    type: string
    format: date-time
    description: "When this moderation ticket was created."
  updatedAt:
    type: string
    format: date-time
    description: "When this moderation ticket was last updated."

