$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/message.schema.json"
title: "Message"
description: "A persistent message authored by an identified conversation participant and retained after deletion or departure."
type: object
additionalProperties: false
required:
  - id
  - conversationId
  - authorIdentityId
  - body
  - sentAt
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for this message."
  conversationId:
    type: string
    format: uuid
    description: "Conversation in which the message was posted."
  authorIdentityId:
    type: string
    format: uuid
    description: "Person or bot that authored the message, retained after membership ends."
  body:
    type: string
    minLength: 1
    maxLength: 10000
    description: "Original message content retained even when hidden by soft deletion."
  sentAt:
    type: string
    format: date-time
    description: "When the author posted the message."
  deletedAt:
    type: string
    format: date-time
    description: "When the message was soft-deleted and removed from participant views."
  deletedById:
    type: string
    format: uuid
    description: "Author, owner, or administrator identity that soft-deleted the message."
  deletionReason:
    type: string
    maxLength: 2000
    description: "Optional reason recorded for the soft deletion."
  createdAt:
    type: string
    format: date-time
    description: "When this message record was created."
  updatedAt:
    type: string
    format: date-time
    description: "When this message record was last updated."
dependentRequired:
  deletedAt:
    - deletedById
allOf:
  - if:
      not:
        required:
          - deletedAt
    then:
      not:
        anyOf:
          - required:
              - deletedById
          - required:
              - deletionReason
