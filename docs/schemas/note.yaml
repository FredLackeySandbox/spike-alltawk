$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/note.schema.json"
title: "Note"
description: "Context authored by an identified user and attached to exactly one conversation, message, or moderation ticket."
type: object
additionalProperties: false
required:
  - id
  - authorIdentityId
  - body
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for this note."
  authorIdentityId:
    type: string
    format: uuid
    description: "Identity that authored the note."
  conversationId:
    type: string
    format: uuid
    description: "Conversation directly receiving the note when this is a conversation note."
  messageId:
    type: string
    format: uuid
    description: "Message directly receiving the note when this is a message note."
  moderationTicketId:
    type: string
    format: uuid
    description: "Moderation ticket directly receiving the note when this is a ticket note."
  body:
    type: string
    minLength: 1
    maxLength: 10000
    description: "User-authored note content."
  visibility:
    type: string
    enum:
      - authorOnly
      - moderators
      - owners
      - participants
    description: "Provisional audience choice; optional until the final note-visibility model is decided."
  deletedAt:
    type: string
    format: date-time
    description: "When the retained note was soft-deleted, if ever."
  deletedById:
    type: string
    format: uuid
    description: "Identity that soft-deleted the note, if applicable."
  createdAt:
    type: string
    format: date-time
    description: "When this note was created."
  updatedAt:
    type: string
    format: date-time
    description: "When this note was last updated."
oneOf:
  - required:
      - conversationId
    not:
      anyOf:
        - required:
            - messageId
        - required:
            - moderationTicketId
  - required:
      - messageId
    not:
      anyOf:
        - required:
            - conversationId
        - required:
            - moderationTicketId
  - required:
      - moderationTicketId
    not:
      anyOf:
        - required:
            - conversationId
        - required:
            - messageId
