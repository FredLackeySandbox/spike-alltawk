$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/membership-role-period.schema.json"
title: "Membership Role Period"
description: "A time-bounded owner, administrator, member, or none role assignment in a conversation."
type: object
additionalProperties: false
required:
  - id
  - membershipId
  - conversationId
  - identityId
  - role
  - effectiveFrom
  - assignedById
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for this role period."
  membershipId:
    type: string
    format: uuid
    description: "Membership whose role history contains this period."
  conversationId:
    type: string
    format: uuid
    description: "Conversation copied onto the period to support direct DynamoDB access patterns."
  identityId:
    type: string
    format: uuid
    description: "Identity copied onto the period to support direct history queries."
  role:
    type: string
    enum:
      - owner
      - administrator
      - member
      - none
    description: "Role effective during this period; none is the role used for a ban."
  effectiveFrom:
    type: string
    format: date-time
    description: "Inclusive timestamp at which this role assignment began."
  effectiveTo:
    type: string
    format: date-time
    description: "Exclusive timestamp at which this role assignment ended; omitted for the current role."
  assignedById:
    type: string
    format: uuid
    description: "Identity that assigned the role, including the creator for the initial owner period."
  endedById:
    type: string
    format: uuid
    description: "Identity that ended this period, when an actor performed the change."
  createdAt:
    type: string
    format: date-time
    description: "When this role-period record was created."
  updatedAt:
    type: string
    format: date-time
    description: "When this role-period record was last updated."

