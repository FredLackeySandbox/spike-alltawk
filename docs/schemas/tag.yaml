$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/tag.schema.json"
title: "Tag"
description: "A reusable, case-insensitive tag used to identify, discover, and join conversations."
type: object
additionalProperties: false
required:
  - id
  - normalizedValue
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for this tag."
  normalizedValue:
    type: string
    minLength: 1
    maxLength: 129
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)?$"
    description: "Canonical lowercase tag value used for equality and search; one optional colon separates key and value."
  displayValue:
    type: string
    minLength: 1
    maxLength: 129
    pattern: "^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*(?::[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*)?$"
    description: "Optional preserved-casing form for display while the casing policy remains unresolved."
  createdAt:
    type: string
    format: date-time
    description: "When this shared tag was first created."
  updatedAt:
    type: string
    format: date-time
    description: "When this tag was last updated."
