$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://tawk.local/schemas/tag.schema.json"
title: "Tag"
description: "A shared lowercase tag used to identify, discover, and join conversations."
type: object
additionalProperties: false
required:
  - id
  - value
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for the normalized tag."
  value:
    type: string
    maxLength: 31
    pattern: "^[a-z0-9](?:[a-z0-9-]{0,13}[a-z0-9])?(?::[a-z0-9](?:[a-z0-9-]{0,13}[a-z0-9])?)?$"
    description: "Normalized lowercase simple or key/value tag; each component contains 1 to 15 Latin letters, numbers, or internal hyphens, and a key/value tag contains exactly one colon."
  createdAt:
    type: string
    format: date-time
    description: "When this normalized tag was first created."
  updatedAt:
    type: string
    format: date-time
    description: "When this tag record was last updated."
