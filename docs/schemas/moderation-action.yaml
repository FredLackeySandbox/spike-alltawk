$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/moderation-action.schema.json"
title: "Moderation Action"
description: "An auditable action taken by an owner or administrator while handling conversation conduct or a ticket."
type: object
additionalProperties: false
required:
  - id
  - conversationId
  - actorIdentityId
  - type
  - occurredAt
  - createdAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for this moderation action."
  moderationTicketId:
    type: string
    format: uuid
    description: "Ticket that prompted the action, when the action was taken during ticket review."
  conversationId:
    type: string
    format: uuid
    description: "Conversation in which the moderator had authority to act."
  actorIdentityId:
    type: string
    format: uuid
    description: "Owner or administrator that performed the action."
  targetIdentityId:
    type: string
    format: uuid
    description: "Participant affected by a removal, ban, unban, suspension, or suspension lift."
  targetMessageId:
    type: string
    format: uuid
    description: "Message affected by a delete-message action."
  postingSuspensionId:
    type: string
    format: uuid
    description: "Posting Suspension created or lifted by this action, when applicable."
  type:
    type: string
    enum:
      - deleteMessage
      - removeParticipant
      - banParticipant
      - unbanParticipant
      - suspendPosting
      - liftPostingSuspension
    description: "Kind of moderation change performed."
  reason:
    type: string
    maxLength: 4000
    description: "Optional rationale recorded by the moderator."
  occurredAt:
    type: string
    format: date-time
    description: "When the moderation action took effect."
  createdAt:
    type: string
    format: date-time
    description: "When this moderation-action record was created."
allOf:
  - if:
      properties:
        type:
          const: deleteMessage
      required:
        - type
    then:
      required:
        - targetMessageId
  - if:
      properties:
        type:
          enum:
            - removeParticipant
            - banParticipant
            - unbanParticipant
            - suspendPosting
            - liftPostingSuspension
      required:
        - type
    then:
      required:
        - targetIdentityId
  - if:
      properties:
        type:
          enum:
            - suspendPosting
            - liftPostingSuspension
      required:
        - type
    then:
      required:
        - postingSuspensionId
