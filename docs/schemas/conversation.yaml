$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/conversation.schema.json"
title: "Conversation"
description: "A tagged messaging space, including its discovery mode, lifecycle, and optional moderation-discussion purpose."
type: object
additionalProperties: false
required:
  - id
  - createdById
  - purpose
  - visibility
  - matchingMode
  - status
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for this conversation."
  createdById:
    type: string
    format: uuid
    description: "Identity that created the conversation and became its first owner."
  purpose:
    type: string
    enum:
      - standard
      - moderationDiscussion
    description: "Whether this is an ordinary conversation or a confidential discussion linked to a moderation ticket."
  moderationTicketId:
    type: string
    format: uuid
    description: "Moderation ticket discussed by this conversation when its purpose is moderationDiscussion."
  title:
    type: string
    minLength: 1
    maxLength: 200
    description: "Optional display title retained while conversation presentation requirements remain unresolved."
  description:
    type: string
    maxLength: 2000
    description: "Optional explanatory text for the conversation."
  visibility:
    type: string
    enum:
      - listed
      - unlisted
    description: "Whether the conversation is identifiable in public tag-search results."
  matchingMode:
    type: string
    enum:
      - inclusive
      - exclusive
      - allTags
    description: "Tag-match behavior; unlisted conversations use allTags, while listed conversations use inclusive or exclusive."
  status:
    type: string
    enum:
      - active
      - archived
    description: "Whether the conversation accepts active use or is retained as an archived record."
  archivedAt:
    type: string
    format: date-time
    description: "When the conversation was archived, if applicable."
  archivedById:
    type: string
    format: uuid
    description: "Owner identity that archived the conversation, if applicable."
  createdAt:
    type: string
    format: date-time
    description: "When this conversation was created."
  updatedAt:
    type: string
    format: date-time
    description: "When this conversation was last updated."
allOf:
  - if:
      properties:
        visibility:
          const: unlisted
      required:
        - visibility
    then:
      properties:
        matchingMode:
          const: allTags
  - if:
      properties:
        visibility:
          const: listed
      required:
        - visibility
    then:
      properties:
        matchingMode:
          enum:
            - inclusive
            - exclusive
  - if:
      properties:
        purpose:
          const: moderationDiscussion
      required:
        - purpose
    then:
      required:
        - moderationTicketId
      properties:
        visibility:
          const: unlisted
        matchingMode:
          const: allTags
  - if:
      properties:
        purpose:
          const: standard
      required:
        - purpose
    then:
      not:
        required:
          - moderationTicketId
  - if:
      properties:
        status:
          const: archived
      required:
        - status
    then:
      required:
        - archivedAt
        - archivedById
  - if:
      properties:
        status:
          const: active
      required:
        - status
    then:
      not:
        anyOf:
          - required:
              - archivedAt
          - required:
              - archivedById
