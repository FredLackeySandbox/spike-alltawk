$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/bot-credential.schema.json"
title: "Bot Credential"
description: "A revocable token credential used by a bot identity to authenticate without storing the plaintext token."
type: object
additionalProperties: false
required:
  - id
  - identityId
  - tokenDigest
  - status
  - issuedAt
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for this bot credential."
  identityId:
    type: string
    format: uuid
    description: "Bot identity authenticated by this credential; it refers to an Identity record whose type is bot."
  tokenDigest:
    type: string
    minLength: 32
    description: "One-way digest of the secret token; the plaintext token is never retained."
  tokenPrefix:
    type: string
    minLength: 1
    maxLength: 32
    description: "Optional non-secret prefix used to identify the credential during lookup or support."
  status:
    type: string
    enum:
      - active
      - revoked
    description: "Whether this credential may currently authenticate its bot."
  issuedAt:
    type: string
    format: date-time
    description: "When this credential became available for authentication."
  expiresAt:
    type: string
    format: date-time
    description: "Optional time after which this credential is no longer accepted."
  lastUsedAt:
    type: string
    format: date-time
    description: "Most recent successful authentication time, when recorded."
  revokedAt:
    type: string
    format: date-time
    description: "When this credential was revoked, if applicable."
  createdAt:
    type: string
    format: date-time
    description: "When this credential record was created."
  updatedAt:
    type: string
    format: date-time
    description: "When this credential record was last updated."
allOf:
  - if:
      properties:
        status:
          const: revoked
      required:
        - status
    then:
      required:
        - revokedAt
  - if:
      properties:
        status:
          const: active
      required:
        - status
    then:
      not:
        required:
          - revokedAt
