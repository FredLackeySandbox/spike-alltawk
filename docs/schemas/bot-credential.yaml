$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://tawk.local/schemas/bot-credential.schema.json"
title: "Bot Credential"
description: "A revocable token credential that authenticates one bot identity without storing the raw token."
type: object
additionalProperties: false
required:
  - id
  - identityId
  - tokenHash
  - status
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    description: "Stable unique identifier for the bot credential."
  identityId:
    type: string
    format: uuid
    description: "Bot identity authenticated by this credential, referencing identity.yaml."
  tokenHash:
    type: string
    minLength: 1
    description: "One-way hash used to verify the token; the raw credential is never retained here."
  tokenPrefix:
    type: string
    minLength: 1
    description: "Optional non-secret token prefix used only when the selected credential format needs prefix-based lookup."
  status:
    type: string
    enum: [active, revoked, expired]
    description: "Current credential lifecycle state."
  lastUsedAt:
    type: string
    format: date-time
    description: "Most recent successful use of this credential."
  expiresAt:
    type: string
    format: date-time
    description: "Optional time after which the credential may no longer authenticate."
  revokedAt:
    type: string
    format: date-time
    description: "When this credential was revoked, when applicable."
  createdAt:
    type: string
    format: date-time
    description: "When this credential was created."
  updatedAt:
    type: string
    format: date-time
    description: "When this credential was last updated."
allOf:
  - if:
      properties:
        status:
          const: revoked
      required: [status]
    then:
      required: [revokedAt]
  - if:
      properties:
        status:
          const: expired
      required: [status]
    then:
      required: [expiresAt]
  - if:
      properties:
        status:
          const: active
      required: [status]
    then:
      not:
        required: [revokedAt]
